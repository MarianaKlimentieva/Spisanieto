
<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мода и тенденции | СПИСАНИЕТО.</title>
<meta name="description" content="Мода, стил, красота и тенденции в СПИСАНИЕТО.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f7f6f2;
  --ink: #171717;
  --accent: #a21f5a;
  --muted: #77736f;
  --line: #d9d6d0;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Plus Jakarta Sans', Arial, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
}
a { color: inherit; text-decoration: none; }
button { font: inherit; }
.site-header {
  max-width: 1320px;
  margin: 0 auto;
  padding: 28px 32px 0;
}
.masthead {
  text-align: center;
  padding: 4px 0 24px;
}
.logo {
  font: 600 clamp(42px, 6vw, 76px)/.95 var(--serif);
  letter-spacing: -.045em;
}
.logo span { color: var(--accent); }
.tagline {
  margin-top: 12px;
  font-family: 'Great Vibes', cursive;
  font-size: clamp(24px, 3vw, 34px);
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
  color: var(--accent);
}
.nav {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  padding: 15px 0;
}
.nav a {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .11em;
  text-transform: uppercase;
}
.nav a:hover { color: var(--accent); }
.page {
  width: min(1180px, calc(100% - 48px));
  margin: 0 auto;
}
.section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin: 42px 0 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--ink);
}
.eyebrow {
  color: var(--accent);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
}
h1, h2, h3, p { margin-top: 0; }
.section-heading h1 {
  margin: 5px 0 0;
  font: 500 clamp(34px, 4vw, 52px)/.98 var(--serif);
}
.section-heading p {
  margin: 0 0 4px;
  max-width: 420px;
  color: var(--accent);
  font-family: 'Great Vibes', cursive;
  font-size: clamp(23px, 2.5vw, 30px);
  font-weight: 400;
  line-height: 1.3;
}
.hero {
  position: relative;
  overflow: hidden;
  background: #e7e1dc;
}
.hero-image {
  display: block;
  width: 100%;
  height: clamp(340px, 49vw, 590px);
  object-fit: cover;
  object-position: center;
}
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(0,0,0,.18), transparent 65%);
  pointer-events: none;
}
.hero-panel {
  position: absolute;
  z-index: 1;
  left: 3%;
  bottom: 0;
  transform: none;
  width: 94%;
  box-sizing: border-box;
  padding: 12px 24px;
  background: rgba(255,255,255,.97);
  text-align: center;
}
.hero-panel h2 {
  margin: 12px 0;
  font: 500 clamp(30px, 4vw, 49px)/.98 var(--serif);
}
.hero-panel p {
  margin-bottom: 15px;
  color: #5e5a56;
  font-size: 12px;
  line-height: 1.8;
}
.meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  color: var(--muted);
  font-size: 10px;
}
.hero-controls {
  display: none;
}
.hero-controls button {
  width: 38px;
  height: 38px;
  border: 1px solid rgba(255,255,255,.8);
  background: rgba(247,246,242,.92);
  color: var(--ink);
  cursor: pointer;
}
.hero-controls button:hover { background: var(--accent); color: white; }
.hero-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 15px;
}
.hero-dots button {
  width: 7px;
  height: 7px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: #c6c0ba;
  cursor: pointer;
}
.hero-dots button.active { background: var(--accent); }
.topic-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
  margin: 34px 0 55px;
}
.topic-card {
  min-width: 0;
  position: relative;
}

.topic-card a {
  display: block;
  position: relative;
  text-decoration: none;
}
.topic-card a::after {
  content: "";
  position: absolute;
  left: 8%;
  right: 8%;
  bottom: 0;
  height: 70px;
  background: #fff;
  z-index: 1;
}
.topic-card img {
  width: 100%;
  aspect-ratio: 1.48;
  object-fit: cover;
  display: block;
  background: #e5e0da;
}
.topic-card h3 {
  position: relative;
  z-index: 2;
  margin: -55px 8% 0;
  padding: 14px 12px 0;
  background: #fff;
  font: 500 25px/1.05 var(--serif);
}
.topic-card p {
  position: relative;
  z-index: 2;
  margin: 0 8%;
  padding: 0 12px 14px;
  background: #fff;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}
.topic-card a:hover h3 { color: var(--accent); }
.news-heading {
  margin-top: 0;
}
.news-heading h2 {
  margin: 0;
  font: 500 36px/1 var(--serif);
}
.news-list { border-top: 1px solid var(--ink); }
.news-item {
  display: grid;
  grid-template-columns: minmax(220px, 38%) minmax(0, 1fr);
  gap: clamp(22px, 4vw, 48px);
  padding: 28px 0;
  border-bottom: 1px solid var(--line);
}
.news-image {
  display: block;
  width: 100%;
  aspect-ratio: 1.35;
  object-fit: cover;
  background: #e5e0da;
}
.news-copy {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  min-width: 0;
}
.news-copy h3 {
  margin: 11px 0 9px;
  font: 500 clamp(27px, 3.2vw, 39px)/1.02 var(--serif);
}
.news-copy h3 a:hover { color: var(--accent); }
.news-copy .excerpt {
  margin: 0 0 15px;
  max-width: 640px;
  color: #5e5a56;
  font-size: 12px;
  line-height: 1.9;
}
.news-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  width: 100%;
}
.share-links {
  display: flex;
  align-items: center;
  gap: 7px;
}
.share-links a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 29px;
  height: 29px;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  transition: .2s ease;
}
.share-links a:hover {
  color: white;
  background: var(--accent);
  border-color: var(--accent);
}
.read-more {
  color: var(--accent);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.status {
  padding: 45px 12px;
  color: var(--muted);
  text-align: center;
  font-size: 12px;
}
.pagination {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 28px 0 55px;
}
.pagination button {
  width: 35px;
  height: 35px;
  border: 1px solid var(--line);
  background: transparent;
  cursor: pointer;
}
.pagination button.active,
.pagination button:hover {
  color: white;
  background: var(--accent);
  border-color: var(--accent);
}
.site-footer {
  padding: 28px 20px;
  border-top: 1px solid var(--ink);
  text-align: center;
  font: 500 28px var(--serif);
}
.site-footer span { color: var(--accent); }
@media (max-width: 700px) {
  .site-header { padding: 22px 18px 0; }
  .nav { gap: 14px 18px; }
  .nav a { font-size: 9px; }
  .page { width: calc(100% - 32px); }
  .section-heading { display: block; margin-top: 30px; }
  .section-heading p { margin-top: 12px; }
  .hero-image { height: 500px; }
  .hero-panel { left: 12px; bottom: 12px; width: calc(100% - 24px); }
  .hero-controls { right: 12px; top: 12px; bottom: auto; }
  .topic-grid { grid-template-columns: 1fr; gap: 25px; margin-bottom: 42px; }
  .topic-card img { aspect-ratio: 1.6; }
  .news-item { grid-template-columns: 1fr; gap: 18px; padding: 22px 0; }
  .news-image { aspect-ratio: 1.5; }
  .news-copy h3 { font-size: 32px; }
}
</style>
</head>
<body>
<header class="site-header">
  <div class="masthead">
    <a class="logo" href="index.html">СПИСАНИЕТО<span>.</span></a>
    <div class="tagline">Всичко важно. На едно място.</div>
  </div>
<nav class="nav" aria-label="Основна навигация">
  <a href="index.html">НОВИНИ</a>
  <a href="index.html?category=%D0%9F%D0%BE%D0%BB%D0%B8%D1%82%D0%B8%D0%BA%D0%B0">ПОЛИТИКА</a>
  <a href="index.html?category=%D0%A1%D0%B2%D1%8F%D1%82">СВЯТ</a>
  <a href="index.html?category=%D0%90%D0%BD%D0%B0%D0%BB%D0%B8%D0%B7%D0%B8">АНАЛИЗИ</a>
  <a href="index.html?category=%D0%9B%D0%B0%D0%B9%D1%84%D1%81%D1%82%D0%B0%D0%B9%D0%BB">ЛАЙФСТАЙЛ</a>
  <a href="index.html#about">ЗА НАС</a>
</nav>
</header>

<main class="page">
  <section class="section-heading">
    <div>
      <div class="eyebrow">Вдъхновение · Стил · Красота</div>
      <h1 id="page-title">Мода и тенденции</h1>
    </div>
 
  </section>

  <section aria-label="Водещи публикации">
    <div id="hero" class="hero">
      <div class="status">Зареждане на публикациите...</div>
    </div>
    <div id="hero-dots" class="hero-dots"></div>
  </section>

  <section class="topic-grid" aria-label="Тематични публикации" id="topic-grid"></section>

  <section id="all-news">
    <div class="section-heading news-heading">
      <div>
       
        <h2>Последни публикации</h2>
      </div>
    </div>
    <div id="news-list" class="news-list">
      <div class="status">Зареждане на новините...</div>
    </div>
    <div id="pagination" class="pagination"></div>
  </section>
</main>

<footer class="site-footer">СПИСАНИЕТО<span>.</span></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://hxvflentlaktgwimsevc.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_waLxhS_U0hYHzlfp016b4g_bwDTjWGY';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1512496015851-a90fb38ba796?auto=format&fit=crop&w=1200&q=80';
const PAGE_SIZE = 6;
let allArticles = [];
let currentPage = 1;
let currentSlide = 0;

function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function articleUrl(id) {
  return 'article.html?id=' + encodeURIComponent(id);
}

function formatDate(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  return date.toLocaleDateString('bg-BG', {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric'
  });
}

function excerpt(article) {
  const text = article.subtitle || '';
  return text.length > 210 ? text.slice(0, 207) + '…' : text;
}

function shareLinks(article) {
  const url = encodeURIComponent(new URL(articleUrl(article.id), window.location.href).href);
  const title = encodeURIComponent(article.title || 'СПИСАНИЕТО.');
  return `
    <div class="share-links" aria-label="Споделяне">
      <a href="https://www.facebook.com/sharer/sharer.php?u=${url}" target="_blank" rel="noopener noreferrer" aria-label="Сподели във Facebook" title="Facebook">f</a>
      <a href="https://t.me/share/url?url=${url}&text=${title}" target="_blank" rel="noopener noreferrer" aria-label="Сподели в Telegram" title="Telegram">➤</a>
      <a href="https://wa.me/?text=${title}%20${url}" target="_blank" rel="noopener noreferrer" aria-label="Сподели в WhatsApp" title="WhatsApp">w</a>
    </div>`;
}

function renderHero() {
  const hero = document.getElementById('hero');
  const dots = document.getElementById('hero-dots');
  const slides = allArticles.slice(0, Math.min(5, allArticles.length));

  if (!slides.length) {
    hero.innerHTML = '<div class="status">Все още няма публикувани материали в тази рубрика.</div>';
    dots.innerHTML = '';
    return;
  }

  const article = slides[currentSlide % slides.length];
  hero.innerHTML = `
    <a href="${articleUrl(article.id)}" aria-label="${escapeHtml(article.title)}">
      <img class="hero-image" src="${escapeHtml(article.image_url || FALLBACK_IMAGE)}" alt="${escapeHtml(article.title)}">
    </a>
    <div class="hero-panel">
     
      
      <h2><a href="${articleUrl(article.id)}">${escapeHtml(article.title)}</a></h2>
      ${article.subtitle ? `<p>${escapeHtml(article.subtitle)}</p>` : ''}
    
    </div>
    ${slides.length > 1 ? `<div class="hero-controls"><button type="button" id="prev-slide" aria-label="Предишна публикация">←</button><button type="button" id="next-slide" aria-label="Следваща публикация">→</button></div>` : ''}
  `;

  dots.innerHTML = slides.map((item, index) =>
    `<button type="button" class="${index === currentSlide ? 'active' : ''}" data-slide="${index}" aria-label="Публикация ${index + 1}"></button>`
  ).join('');

  const prev = document.getElementById('prev-slide');
  const next = document.getElementById('next-slide');
  if (prev) prev.addEventListener('click', () => {
    currentSlide = (currentSlide - 1 + slides.length) % slides.length;
    renderHero();
  });
  if (next) next.addEventListener('click', () => {
    currentSlide = (currentSlide + 1) % slides.length;
    renderHero();
  });
  dots.querySelectorAll('[data-slide]').forEach(button => {
    button.addEventListener('click', () => {
      currentSlide = Number(button.dataset.slide);
      renderHero();
    });
  });
}

function renderTopics() {
  const grid = document.getElementById('topic-grid');
  const topics = allArticles.slice(1, 4);
  if (!topics.length) {
    grid.innerHTML = '';
    return;
  }

  grid.innerHTML = topics.map(article => `
    <article class="topic-card">
      <a href="${articleUrl(article.id)}">
        <img src="${escapeHtml(article.image_url || FALLBACK_IMAGE)}" alt="${escapeHtml(article.title)}" loading="lazy">
        <h3>${escapeHtml(article.title)}</h3>
        <p>${escapeHtml(excerpt(article))}</p>
      </a>
    </article>
  `).join('');
}

function renderNews() {
  const list = document.getElementById('news-list');
  const pagination = document.getElementById('pagination');
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageArticles = allArticles.slice(start, start + PAGE_SIZE);

  if (!pageArticles.length) {
    list.innerHTML = '<div class="status">Няма други публикации.</div>';
    pagination.innerHTML = '';
    return;
  }

  list.innerHTML = pageArticles.map(article => `
    <article class="news-item">
      <a href="${articleUrl(article.id)}">
        <img class="news-image" src="${escapeHtml(article.image_url || FALLBACK_IMAGE)}" alt="${escapeHtml(article.title)}" loading="lazy">
      </a>
      <div class="news-copy">
        <div class="eyebrow">${escapeHtml(article.category || 'Мода и тенденции')}</div>
        <div class="meta"><time>${formatDate(article.created_at)}</time></div>
        <h3><a href="${articleUrl(article.id)}">${escapeHtml(article.title)}</a></h3>
        ${article.subtitle ? `<p class="excerpt">${escapeHtml(excerpt(article))}</p>` : ''}
        <div class="news-footer">
          ${shareLinks(article)}
          <a class="read-more" href="${articleUrl(article.id)}">Прочети повече →</a>
        </div>
      </div>
    </article>
  `).join('');

  const pageCount = Math.ceil(allArticles.length / PAGE_SIZE);
  pagination.innerHTML = pageCount > 1
    ? Array.from({ length: pageCount }, (_, i) =>
        `<button type="button" class="${i + 1 === currentPage ? 'active' : ''}" data-page="${i + 1}">${i + 1}</button>`
      ).join('')
    : '';

  pagination.querySelectorAll('[data-page]').forEach(button => {
    button.addEventListener('click', () => {
      currentPage = Number(button.dataset.page);
      renderNews();
      document.getElementById('all-news').scrollIntoView({ behavior: 'smooth' });
    });
  });
}

async function loadCategory() {
  const list = document.getElementById('news-list');
  try {
    const { data, error } = await supabaseClient
      .from('news')
      .select('id,title,subtitle,image_url,category,created_at')
      .eq('status', 'published')
      .eq('category', 'Мода и тенденции')
      .order('created_at', { ascending: false });

    if (error) throw error;
    allArticles = data || [];
    renderHero();
    renderTopics();
    renderNews();
  } catch (error) {
    console.error('Грешка при зареждане на категорията:', error);
    list.innerHTML = '<div class="status">Публикациите временно не могат да бъдат заредени.</div>';
    document.getElementById('hero').innerHTML = '<div class="status">Публикациите временно не могат да бъдат заредени.</div>';
  }
}

loadCategory();
</script>
</body>
</html>
