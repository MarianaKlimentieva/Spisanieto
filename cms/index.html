<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админ панел – СПИСАНИЕТО.</title>
</head>
<body>
  <!-- Задължителният контейнер, който очаква CMS-ът -->
  <div id="nc-root"></div>

  <!-- Зареждаме Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'MarianaKlimentieva/Spisanieto',
          branch: 'main',
          auth_type: 'pkce'
        },
        media_folder: 'images',
        public_folder: '/images',
        collections: [
          {
            name: 'posts',
            label: 'Статии',
            folder: '_posts',
            create: true,
            fields: [
              { label: 'Заглавие', name: 'title', widget: 'string' },
              { label: 'Дата', name: 'date', widget: 'datetime' },
              { label: 'Съдържание', name: 'body', widget: 'markdown' }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
