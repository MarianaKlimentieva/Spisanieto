backend:
  name: github
  repo: MarianaKlimentieva/Spisanieto
  branch: main
  auth_type: pkce

media_folder: images
public_folder: /images

collections:
  - name: posts
    label: Статии
    folder: _posts
    create: true
    fields:
      - {label: Заглавие, name: title, widget: string}
      - {label: Съдържание, name: body, widget: markdown}
