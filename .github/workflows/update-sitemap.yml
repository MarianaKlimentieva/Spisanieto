
name: Update sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sitemap from Cloudflare API
        env:
          API_URL: https://spisanieto-api.spisanieto-news.workers.dev/api/news
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const SITE = 'https://spisanieto.bg';
          const API = process.env.API_URL;

          function escapeXml(value) {
            return String(value)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&apos;');
          }

          function unescapeXml(value) {
            return value
              .replace(/&amp;/g, '&')
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'");
          }

          async function main() {
            const sitemapPath = 'sitemap.xml';

            const oldXml = fs.existsSync(sitemapPath)
              ? fs.readFileSync(sitemapPath, 'utf8')
              : '';

            // Запазваме всички досегашни адреси,
            // включително старите статии.
            const entriesMap = new Map();

            for (const match of oldXml.matchAll(
              /<url>([\s\S]*?)<\/url>/g
            )) {
              const block = match[1];
              const locMatch = block.match(
                /<loc>([\s\S]*?)<\/loc>/
              );

              if (!locMatch) continue;

              const loc = unescapeXml(locMatch[1].trim());

              try {
                const url = new URL(loc);

                if (url.origin !== SITE) continue;

                url.hash = '';

                const lastmodMatch = block.match(
                  /<lastmod>([\s\S]*?)<\/lastmod>/
                );

                entriesMap.set(url.href, {
                  loc: url.href,
                  lastmod: lastmodMatch
                    ? unescapeXml(lastmodMatch[1].trim())
                    : ''
                });
              } catch {
                continue;
              }
            }

            // Основни постоянни страници.
            const staticPages = [
              '/',
              '/art.html',
              '/culinary.html',
              '/news.html',
              '/opinions.html',
              '/poveritelnost.html'
            ];

            for (const path of staticPages) {
              const loc = `${SITE}${path}`;

              if (!entriesMap.has(loc)) {
                entriesMap.set(loc, {
                  loc,
                  lastmod: ''
                });
              }
            }

            // Вземаме публикуваните новини от Cloudflare API.
            let offset = 0;
            const pageSize = 100;
            let totalNews = 0;

            while (true) {
              const url = new URL(API);

              url.searchParams.set('limit', String(pageSize));
              url.searchParams.set('offset', String(offset));

              const response = await fetch(url);

              if (!response.ok) {
                throw new Error(
                  `Cloudflare API error ${response.status}: ` +
                  await response.text()
                );
              }

              const result = await response.json();

              if (!result || !Array.isArray(result.news)) {
                throw new Error(
                  'Unexpected Cloudflare API response.'
                );
              }

              const rows = result.news;

              for (const item of rows) {
                if (item.id == null) continue;

                const articleUrl = new URL(
                  '/article.html',
                  SITE
                );

                articleUrl.searchParams.set(
                  'id',
                  String(item.id)
                );

                const loc = articleUrl.href;
                const date = item.updated_at || item.created_at;
                const timestamp = date ? new Date(date) : null;

                const lastmod = timestamp &&
                  !Number.isNaN(timestamp.getTime())
                  ? timestamp.toISOString()
                  : '';

                entriesMap.set(loc, {
                  loc,
                  lastmod
                });

                totalNews++;
              }

              if (rows.length < pageSize) break;

              offset += rows.length;
            }

            // Старите адреси остават, дори ако D1 е празна.
            const entries = [...entriesMap.values()];

            entries.sort((a, b) =>
              a.loc.localeCompare(b.loc)
            );

            const body = entries.map(item =>
              [
                '  <url>',
                `    <loc>${escapeXml(item.loc)}</loc>`,
                item.lastmod
                  ? `    <lastmod>${escapeXml(item.lastmod)}</lastmod>`
                  : '',
                '  </url>'
              ].filter(Boolean).join('\n')
            ).join('\n');

            const xml =
              '<?xml version="1.0" encoding="UTF-8"?>\n' +
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' +
              body + '\n</urlset>\n';

            fs.writeFileSync(sitemapPath, xml, 'utf8');

            console.log(
              `Sitemap generated: ${entries.length} URLs.`
            );
            console.log(
              `News received from Cloudflare: ${totalNews}.`
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Save sitemap changes
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap from Cloudflare API"
          git push
