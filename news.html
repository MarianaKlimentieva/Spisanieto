<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Всички новини – СПИСАНИЕТО.</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Great+Vibes&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --bg-color: #f7f6f2;
            --text-color: #111111;
            --accent-color: #a21f5a;
            --border-color: #e2dfd7;

            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            line-height: 1.6;
        }

        img {
            max-width: 100%;
        }

        /* =========================================
           TOP BAR — ДАТА, ВРЕМЕ И ЧАС
        ========================================= */

        .top-bar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.8rem 1.5rem 0.3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #666;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .top-bar-right {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            justify-content: flex-end;
        }

        /* =========================================
           BANNER
        ========================================= */

        .top-banner {
            max-width: 1200px;
            margin: 1rem auto 0.5rem;
            padding: 0 1.5rem;
            position: relative;
        }

        .top-banner img {
            width: 100%;
            height: 250px;
            max-height: 250px;
            object-fit: cover;
            object-position: center;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            display: block;
        }

        /* ЛОГО И СЛОГАН ВЪРХУ БАНЕРА */

        .top-banner header {
            position: absolute;
            inset: 0 1.5rem;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            padding: 0 1rem 3.5rem;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.10),
                rgba(0, 0, 0, 0.32)
            );
            border-radius: 6px;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 3.8rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffffff;
            text-decoration: none;
            display: inline-block;
            line-height: 1;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
        }

        .logo-dot {
            color: var(--accent-color);
        }

        .tagline {
            font-family: 'Great Vibes', cursive;
            font-style: normal;
            font-size: clamp(1.8rem, 3vw, 2.4rem);
            font-weight: 400;
            color: #ffffff;
            margin-top: 0.5rem;
            letter-spacing: 0;
            line-height: 1.15;
            text-shadow: 0 2px 7px rgba(0, 0, 0, 0.75);
        }

        /* =========================================
           NAVIGATION
        ========================================= */

        nav {
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2.5rem;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.5rem;
        }

        nav ul {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            list-style: none;
            padding: 0.8rem 0;
            flex-wrap: wrap;
            margin: 0 auto;
        }
