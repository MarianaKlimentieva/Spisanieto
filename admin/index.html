<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Администрация – СПИСАНИЕТО.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f3f3;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 40px;
      border: 1px solid #ddd;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 1px;
    }

    .logo p {
      margin: 8px 0 0;
      color: #777;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <h1>СПИСАНИЕТО.</h1>
      <p>Редакторски панел</p>
    </div>

    <form id="loginForm">

      <label for="email">Имейл</label>
      <input
        type="email"
        id="email"
        required
        autocomplete="username"
      >

      <label for="password">Парола</label>
      <input
        type="password"
        id="password"
        required
        autocomplete="current-password"
      >

      <button type="submit">Вход</button>

    </form>

    <div id="message"></div>

  </div>

  <script type="module">

    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL =
      'https://hxvflentlaktgwimsevc.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_waLxhS_U0hYHzlfp016b4g_bwDTjWGY';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async function(event) {

      event.preventDefault();

      const email =
        document.getElementById('email').value.trim();

      const password =
        document.getElementById('password').value;

      message.textContent = 'Влизане...';

      const { error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        message.textContent =
          'Грешен имейл или парола.';
        return;
      }

      window.location.href = 'dashboard.html';

    });

  </script>

</body>
</html>
