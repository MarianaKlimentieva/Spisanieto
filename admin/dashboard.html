<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Администрация – СПИСАНИЕТО.</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f4ef;
      color: #171717;
      font-family: Arial, sans-serif;
    }

    header {
      background: #111;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 28px;
    }

    #logout {
      background: transparent;
      border: 1px solid #fff;
      color: white;
      padding: 9px 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    #logout:hover {
      background: white;
      color: #111;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
      margin-bottom: 30px;
    }

    h2 {
      font-family: Georgia, serif;
      margin-top: 0;
      font-size: 30px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .section-title h2 {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 300px;
      resize: vertical;
    }

    .featured-box {
      margin-top: 20px;
      padding: 15px;
      background: #f7f4ef;
      border-radius: 5px;
    }

    .featured-box label {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .featured-box input {
      width: auto;
      margin: 0;
    }

    button.save {
      margin-top: 25px;
      background: #8c1d40;
      color: white;
      border: 0;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    button.save:hover {
      opacity: .9;
    }

    button.cancel {
      margin-top: 25px;
      margin-left: 10px;
      background: #777;
      color: white;
      border: 0;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .news-item {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 18px;
      display: flex;
      gap: 20px;
      align-items: center;
      background: #fff;
    }

    .news-thumb {
      width: 150px;
      height: 95px;
      object-fit: cover;
      border-radius: 4px;
      background: #eee;
      flex-shrink: 0;
    }

    .news-info {
      flex: 1;
      min-width: 0;
    }

    .news-title {
      font-family: Georgia, serif;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .news-meta {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .news-subtitle {
      color: #555;
      font-size: 14px;
      line-height: 1.4;
    }

    .featured-label {
      display: inline-block;
      background: #8c1d40;
      color: white;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
      margin-top: 8px;
    }

    .news-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 120px;
    }

    .edit-button,
    .delete-button {
      border: 0;
      padding: 10px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .edit-button {
      background: #111;
      color: white;
    }

    .edit-button:hover {
      background: #333;
    }

    .delete-button {
      background: #eee;
      color: #9b0000;
    }

    .delete-button:hover {
      background: #f3dede;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #777;
      border: 1px dashed #ccc;
      border-radius: 5px;
    }

    .loading {
      color: #777;
      padding: 20px 0;
    }

    @media (max-width: 700px) {

      header {
        padding: 15px;
      }

      header h1 {
        font-size: 22px;
      }

      main {
        margin: 20px auto;
        padding: 0 12px;
      }

      .panel {
        padding: 20px;
      }

      .news-item {
        flex-direction: column;
        align-items: stretch;
      }

      .news-thumb {
        width: 100%;
        height: 180px;
      }

      .news-actions {
        flex-direction: row;
      }

      .news-actions button {
        flex: 1;
      }

      .section-title {
        align-items: flex-start;
      }

    }

  </style>
</head>

<body>

<header>

  <h1>СПИСАНИЕТО.</h1>

  <button id="logout">
    Изход
  </button>

</header>


<main>


  <!-- ========================= -->
  <!-- НОВА / РЕДАКТИРАНА НОВИНА -->
  <!-- ========================= -->

  <div class="panel">

    <h2 id="formTitle">
      Нова новина
    </h2>

    <form id="newsForm">

      <label for="title">
        Заглавие
      </label>

      <input
        type="text"
        id="title"
        placeholder="Въведете заглавие"
        required
      >


      <label for="subtitle">
        Подзаглавие
      </label>

      <input
        type="text"
        id="subtitle"
        placeholder="Въведете подзаглавие"
      >


      <label for="category">
        Категория
      </label>

      <select
        id="category"
        required
      >

        <option value="">
          Изберете категория
        </option>

        <option value="Новини">
          Новини
        </option>

        <option value="Политика">
          Политика
        </option>

        <option value="Свят">
          Свят
        </option>

        <option value="Анализи">
          Анализи
        </option>

        <option value="Лайфстайл">
          Лайфстайл
        </option>

        <option value="Технологии">
          Технологии
        </option>

        <option value="Икономика">
          Икономика
        </option>

      </select>


      <label for="image_url">
        URL на снимката
      </label>

      <input
        type="url"
        id="image_url"
        placeholder="https://..."
      >


      <label for="content">
        Текст на новината
      </label>

      <textarea
        id="content"
        placeholder="Напишете текста на новината..."
        required
      ></textarea>


      <label for="author">
        Автор
      </label>

      <input
        type="text"
        id="author"
        value="СПИСАНИЕТО."
      >


      <div class="featured-box">

        <label>

          <input
            type="checkbox"
            id="is_featured"
          >

          ⭐ Избрана новина
          
        </label>

      </div>


      <button
        type="submit"
        class="save"
        id="saveButton"
      >
        Запази новината
      </button>


      <button
        type="button"
        class="cancel"
        id="cancelEdit"
        style="display:none;"
      >
        Отказ
      </button>


      <div id="message"></div>

    </form>

  </div>



  <!-- ========================= -->
  <!-- ПУБЛИКУВАНИ НОВИНИ -->
  <!-- ========================= -->

  <div class="panel">

    <div class="section-title">

      <h2>
        Публикувани новини
      </h2>

    </div>


    <div
      id="newsList"
      class="news-list"
    >

      <div class="loading">
        Зареждане на новините...
      </div>

    </div>

  </div>


</main>



<script type="module">

  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


  const SUPABASE_URL =
    'https://hxvflentlaktgwimsevc.supabase.co';


  const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_waLxhS_U0hYHzlfp016b4g_bwDTjWGY';


  const supabase =
    createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );



  const form =
    document.getElementById('newsForm');


  const message =
    document.getElementById('message');


  const logout =
    document.getElementById('logout');


  const newsList =
    document.getElementById('newsList');


  const formTitle =
    document.getElementById('formTitle');


  const saveButton =
    document.getElementById('saveButton');


  const cancelEdit =
    document.getElementById('cancelEdit');


  let editingId = null;



  /* ========================= */
  /* ПРОВЕРКА НА ВХОДА */
  /* ========================= */

  const {
    data: { session }
  } = await supabase.auth.getSession();


  if (!session) {

    window.location.href =
      'index.html';

  }



  /* ========================= */
  /* HTML ESCAPE */
  /* ========================= */

  function escapeHtml(value) {

    if (!value) return '';

    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }



  /* ========================= */
  /* ДАТА */
  /* ========================= */

  function formatDate(dateString) {

    if (!dateString) return '';

    const date =
      new Date(dateString);

    return date.toLocaleDateString(
      'bg-BG',
      {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      }
    );

  }



  /* ========================= */
  /* ЗАРЕЖДАНЕ НА НОВИНИТЕ */
  /* ========================= */

  async function loadNews() {

    newsList.innerHTML =
      '<div class="loading">Зареждане на новините...</div>';


    const {
      data,
      error
    } = await supabase

      .from('news')

      .select(`
        id,
        title,
        subtitle,
        category,
        image_url,
        content,
        author,
        is_featured,
        views,
        status,
        created_at,
        updated_at
      `)

      .eq('status', 'published')

      .order(
        'created_at',
        {
          ascending: false
        }
      );


    if (error) {

      console.error(error);

      newsList.innerHTML =
        '<div class="empty">Грешка при зареждането на новините.</div>';

      return;

    }


    if (!data || data.length === 0) {

      newsList.innerHTML =
        '<div class="empty">Все още няма публикувани новини.</div>';

      return;

    }


    newsList.innerHTML =
      data.map(news => {

        const image =
          news.image_url ||
          'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=600&q=80';


        return `

          <div class="news-item">

            <img
              class="news-thumb"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(news.title)}"
            >


            <div class="news-info">

              <div class="news-title">
                ${escapeHtml(news.title)}
              </div>


              <div class="news-meta">

                ${escapeHtml(news.category || 'Новини')}
                &nbsp; • &nbsp;
                ${formatDate(news.created_at)}

                ${
                  news.views
                  ? ` &nbsp; • &nbsp; ${news.views} преглеждания`
                  : ''
                }

              </div>


              ${
                news.subtitle
                ? `
                  <div class="news-subtitle">
                    ${escapeHtml(news.subtitle)}
                  </div>
                `
                : ''
              }


              ${
                news.is_featured
                ? `
                  <span class="featured-label">
                    ⭐ Избрана новина
                  </span>
                `
                : ''
              }

            </div>


            <div class="news-actions">

              <button
                class="edit-button"
                data-id="${news.id}"
              >
                ✏️ Редактирай
              </button>


              <button
                class="delete-button"
                data-id="${news.id}"
              >
                🗑️ Изтрий
              </button>

            </div>

          </div>

        `;

      }).join('');



    /* ========================= */
    /* БУТОНИ РЕДАКТИРАНЕ */
    /* ========================= */

    document
      .querySelectorAll('.edit-button')
      .forEach(button => {

        button.addEventListener(
          'click',
          function() {

            const id =
              this.dataset.id;

            startEdit(id);

          }
        );

      });



    /* ========================= */
    /* БУТОНИ ИЗТРИВАНЕ */
    /* ========================= */

    document
      .querySelectorAll('.delete-button')
      .forEach(button => {

        button.addEventListener(
          'click',
          function() {

            const id =
              this.dataset.id;

            deleteNews(id);

          }
        );

      });

  }



  /* ========================= */
  /* РЕДАКТИРАНЕ */
  /* ========================= */

  async function startEdit(id) {

    message.textContent =
      'Зареждане на новината...';


    const {
      data,
      error
    } = await supabase

      .from('news')

      .select(`
        id,
        title,
        subtitle,
        category,
        image_url,
        content,
        author,
        is_featured,
        status
      `)

      .eq('id', id)

      .single();


    if (error) {

      console.error(error);

      message.textContent =
        'Грешка при зареждането на новината.';

      return;

    }


    editingId =
      data.id;


    document.getElementById('title').value =
      data.title || '';


    document.getElementById('subtitle').value =
      data.subtitle || '';


    document.getElementById('category').value =
      data.category || '';


    document.getElementById('image_url').value =
      data.image_url || '';


    document.getElementById('content').value =
      data.content || '';


    document.getElementById('author').value =
      data.author || 'СПИСАНИЕТО.';


    document.getElementById('is_featured').checked =
      data.is_featured === true;


    formTitle.textContent =
      'Редактиране на новина';


    saveButton.textContent =
      'Запази промените';


    cancelEdit.style.display =
      'inline-block';


    message.textContent =
      '';


    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });

  }



  /* ========================= */
  /* ОТКАЗ ОТ РЕДАКТИРАНЕ */
  /* ========================= */

  cancelEdit.addEventListener(
    'click',
    function() {

      resetForm();

    }
  );



  function resetForm() {

    editingId = null;

    form.reset();


    document.getElementById('author').value =
      'СПИСАНИЕТО.';


    document.getElementById('is_featured').checked =
      false;


    formTitle.textContent =
      'Нова новина';


    saveButton.textContent =
      'Запази новината';


    cancelEdit.style.display =
      'none';


    message.textContent =
      '';

  }



  /* ========================= */
  /* ЗАПАЗВАНЕ */
  /* ========================= */

  form.addEventListener(
    'submit',
    async function(event) {

      event.preventDefault();


      message.textContent =
        editingId
        ? 'Запазване на промените...'
        : 'Публикуване...';


      const title =
        document
          .getElementById('title')
          .value
          .trim();


      const subtitle =
        document
          .getElementById('subtitle')
          .value
          .trim();


      const category =
        document
          .getElementById('category')
          .value;


      const image_url =
        document
          .getElementById('image_url')
          .value
          .trim();


      const content =
        document
          .getElementById('content')
          .value
          .trim();


      const author =
        document
          .getElementById('author')
          .value
          .trim();


      const is_featured =
        document
          .getElementById('is_featured')
          .checked;



      /* ========================= */
      /* РЕДАКЦИЯ */
      /* ========================= */

      if (editingId) {

        const {
          error
        } = await supabase

          .from('news')

          .update({

            title: title,

            subtitle: subtitle,

            category: category,

            image_url:
              image_url || null,

            content: content,

            author:
              author || 'СПИСАНИЕТО.',

            is_featured:
              is_featured,

            updated_at:
              new Date().toISOString()

          })

          .eq(
            'id',
            editingId
          );


        if (error) {

          console.error(error);

          message.textContent =
            'Грешка при редактирането: ' +
            error.message;

          return;

        }


        message.textContent =
          'Новината е редактирана успешно!';


        resetForm();


        await loadNews();


        return;

      }



      /* ========================= */
      /* НОВА НОВИНА */
      /* ========================= */

      const {
        error
      } = await supabase

        .from('news')

        .insert({

          title: title,

          subtitle: subtitle,

          category: category,

          image_url:
            image_url || null,

          content: content,

          author:
            author || 'СПИСАНИЕТО.',

          status:
            'published',

          is_featured:
            is_featured,

          views:
            0

        });


      if (error) {

        console.error(error);

        message.textContent =
          'Грешка при публикуването: ' +
          error.message;

        return;

      }


      message.textContent =
        'Новината е публикувана успешно!';


      resetForm();


      await loadNews();

    }
  );



  /* ========================= */
  /* ИЗТРИВАНЕ */
  /* ========================= */

  async function deleteNews(id) {

    const confirmed =
      confirm(
        'Сигурни ли сте, че искате да изтриете тази новина?'
      );


    if (!confirmed) {
      return;
    }


    const {
      error
    } = await supabase

      .from('news')

      .delete()

      .eq(
        'id',
        id
      );


    if (error) {

      console.error(error);

      alert(
        'Грешка при изтриването: ' +
        error.message
      );

      return;

    }


    if (editingId === id) {

      resetForm();

    }


    await loadNews();

  }



  /* ========================= */
  /* ИЗХОД */
  /* ========================= */

  logout.addEventListener(
    'click',
    async function() {

      await supabase.auth.signOut();

      window.location.href =
        'index.html';

    }
  );



  /* ========================= */
  /* ПЪРВОНАЧАЛНО ЗАРЕЖДАНЕ */
  /* ========================= */

  await loadNews();

</script>

</body>
</html>
