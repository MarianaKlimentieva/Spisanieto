<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Администрация – СПИСАНИЕТО.</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f4ef;
      color: #171717;
      font-family: Arial, sans-serif;
    }

    header {
      background: #111;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 28px;
    }

    #logout {
      background: transparent;
      border: 1px solid #fff;
      color: white;
      padding: 9px 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    #logout:hover {
      background: white;
      color: #111;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
      margin-bottom: 30px;
    }

    h2 {
      font-family: Georgia, serif;
      margin-top: 0;
      font-size: 30px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .section-title h2 {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 300px;
      resize: vertical;
    }

    .image-help {
      margin-top: 7px;
      color: #777;
      font-size: 13px;
    }

    .image-preview {
      margin-top: 15px;
      display: none;
    }

    .image-preview img {
      display: block;
      width: 100%;
      max-width: 600px;
      max-height: 350px;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid #ddd;
    }

    .current-image {
      margin-top: 15px;
      display: none;
    }

    .current-image-title {
      font-size: 13px;
      color: #777;
      margin-bottom: 8px;
    }

    .current-image img {
      display: block;
      width: 100%;
      max-width: 600px;
      max-height: 300px;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid #ddd;
    }

    /* ========================= */
    /* ГАЛЕРИЯ */
    /* ========================= */

    .gallery-help {
      margin-top: 7px;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    .gallery-preview {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .gallery-preview-item {
      position: relative;
      border: 1px solid #ddd;
      border-radius: 5px;
      overflow: hidden;
      background: #f5f5f5;
    }

    .gallery-preview-item img {
      display: block;
      width: 100%;
      height: 130px;
      object-fit: cover;
    }

    .gallery-preview-name {
      padding: 7px;
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: white;
    }

    .existing-gallery {
      margin-top: 15px;
      display: none;
    }

    .existing-gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .existing-gallery-item {
      border: 1px solid #ddd;
      border-radius: 5px;
      overflow: hidden;
      background: #f5f5f5;
    }

    .existing-gallery-item img {
      display: block;
      width: 100%;
      height: 130px;
      object-fit: cover;
    }

    .existing-gallery-caption {
      padding: 7px;
      font-size: 12px;
      color: #777;
      background: white;
    }

    .featured-box {
      margin-top: 20px;
      padding: 15px;
      background: #f7f4ef;
      border-radius: 5px;
    }

    .featured-box label {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .featured-box input {
      width: auto;
      margin: 0;
    }

    button.save {
      margin-top: 25px;
      background: #8c1d40;
      color: white;
      border: 0;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    button.save:hover {
      opacity: .9;
    }

    button.save:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    button.cancel {
      margin-top: 25px;
      margin-left: 10px;
      background: #777;
      color: white;
      border: 0;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .news-item {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 18px;
      display: flex;
      gap: 20px;
      align-items: center;
      background: #fff;
    }

    .news-thumb {
      width: 150px;
      height: 95px;
      object-fit: cover;
      border-radius: 4px;
      background: #eee;
      flex-shrink: 0;
    }

    .news-info {
      flex: 1;
      min-width: 0;
    }

    .news-title {
      font-family: Georgia, serif;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .news-meta {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .news-subtitle {
      color: #555;
      font-size: 14px;
      line-height: 1.4;
    }

    .featured-label {
      display: inline-block;
      background: #8c1d40;
      color: white;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
      margin-top: 8px;
    }

    .news-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 120px;
    }

    .edit-button,
    .delete-button {
      border: 0;
      padding: 10px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .edit-button {
      background: #111;
      color: white;
    }

    .edit-button:hover {
      background: #333;
    }

    .delete-button {
      background: #eee;
      color: #9b0000;
    }

    .delete-button:hover {
      background: #f3dede;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #777;
      border: 1px dashed #ccc;
      border-radius: 5px;
    }

    .loading {
      color: #777;
      padding: 20px 0;
    }

    @media (max-width: 700px) {

      header {
        padding: 15px;
      }

      header h1 {
        font-size: 22px;
      }

      main {
        margin: 20px auto;
        padding: 0 12px;
      }

      .panel {
        padding: 20px;
      }

      .news-item {
        flex-direction: column;
        align-items: stretch;
      }

      .news-thumb {
        width: 100%;
        height: 180px;
      }

      .news-actions {
        flex-direction: row;
      }

      .news-actions button {
        flex: 1;
      }

      .section-title {
        align-items: flex-start;
      }

      .gallery-preview,
      .existing-gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

  </style>
</head>

<body>

<header>

  <h1>СПИСАНИЕТО.</h1>

  <button id="logout">
    Изход
  </button>

</header>


<main>


  <!-- ========================= -->
  <!-- НОВА / РЕДАКТИРАНА НОВИНА -->
  <!-- ========================= -->

  <div class="panel">

    <h2 id="formTitle">
      Нова новина
    </h2>

    <form id="newsForm">

      <label for="title">
        Заглавие
      </label>

      <input
        type="text"
        id="title"
        placeholder="Въведете заглавие"
        required
      >


      <label for="subtitle">
        Подзаглавие
      </label>

      <input
        type="text"
        id="subtitle"
        placeholder="Въведете подзаглавие"
      >


      <label for="category">
        Категория
      </label>

      <select
        id="category"
        required
      >

        <option value="">
          Изберете категория
        </option>

        <option value="Новини">
          Новини
        </option>

        <option value="Политика">
          Политика
        </option>

        <option value="Свят">
          Свят
        </option>

        <option value="Анализи">
          Анализи
        </option>

        <option value="Лайфстайл">
          Лайфстайл
        </option>

        <option value="Технологии">
          Технологии
        </option>

        <option value="Икономика">
          Икономика
        </option>

      </select>


      <label for="image_file">
        Снимка на новината
      </label>

      <input
        type="file"
        id="image_file"
        accept="image/jpeg,image/png,image/webp,image/gif"
      >

      <div class="image-help">
        Избери снимка от компютъра. Тя ще бъде качена автоматично в Supabase.
      </div>


      <div
        id="currentImage"
        class="current-image"
      >

        <div class="current-image-title">
          Текуща снимка:
        </div>

        <img
          id="currentImagePreview"
          src=""
          alt="Текуща снимка"
        >

      </div>


      <div
        id="imagePreview"
        class="image-preview"
      >

        <div class="current-image-title">
          Нова снимка:
        </div>

        <img
          id="imagePreviewImage"
          src=""
          alt="Преглед на снимката"
        >

      </div>


      <!-- ========================= -->
      <!-- ДОПЪЛНИТЕЛНИ СНИМКИ -->
      <!-- ========================= -->

      <label for="gallery_files">
        Допълнителни снимки към новината
      </label>

      <input
        type="file"
        id="gallery_files"
        accept="image/jpeg,image/png,image/webp,image/gif"
        multiple
      >

      <div class="gallery-help">
        Можеш да избереш няколко снимки наведнъж. Те ще бъдат добавени в галерията на новината.
      </div>


      <div
        id="existingGallery"
        class="existing-gallery"
      >

        <div class="current-image-title">
          Вече добавени снимки:
        </div>

        <div
          id="existingGalleryGrid"
          class="existing-gallery-grid"
        ></div>

      </div>


      <div
        id="galleryPreview"
        class="gallery-preview"
      ></div>


      <label for="content">
        Текст на новината
      </label>

      <textarea
        id="content"
        placeholder="Напишете текста на новината..."
        required
      ></textarea>


      <label for="author">
        Автор
      </label>

      <input
        type="text"
        id="author"
        value="СПИСАНИЕТО."
      >


      <div class="featured-box">

        <label>

          <input
            type="checkbox"
            id="is_featured"
          >

          ⭐ Избрана новина

        </label>

      </div>


      <button
        type="submit"
        class="save"
        id="saveButton"
      >
        Запази новината
      </button>


      <button
        type="button"
        class="cancel"
        id="cancelEdit"
        style="display:none;"
      >
        Отказ
      </button>


      <div id="message"></div>

    </form>

  </div>



  <!-- ========================= -->
  <!-- ПУБЛИКУВАНИ НОВИНИ -->
  <!-- ========================= -->

  <div class="panel">

    <div class="section-title">

      <h2>
        Публикувани новини
      </h2>

    </div>


    <div
      id="newsList"
      class="news-list"
    >

      <div class="loading">
        Зареждане на новините...
      </div>

    </div>

  </div>


</main>



<script type="module">

  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


  const SUPABASE_URL =
    'https://hxvflentlaktgwimsevc.supabase.co';


  const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_waLxhS_U0hYHzlfp016b4g_bwDTjWGY';


  const supabase =
    createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const STORAGE_BUCKET =
    'news-images';



  const form =
    document.getElementById('newsForm');


  const message =
    document.getElementById('message');


  const logout =
    document.getElementById('logout');


  const newsList =
    document.getElementById('newsList');


  const formTitle =
    document.getElementById('formTitle');


  const saveButton =
    document.getElementById('saveButton');


  const cancelEdit =
    document.getElementById('cancelEdit');


  const imageFile =
    document.getElementById('image_file');


  const imagePreview =
    document.getElementById('imagePreview');


  const imagePreviewImage =
    document.getElementById('imagePreviewImage');


  const currentImage =
    document.getElementById('currentImage');


  const currentImagePreview =
    document.getElementById('currentImagePreview');


  const galleryFiles =
    document.getElementById('gallery_files');


  const galleryPreview =
    document.getElementById('galleryPreview');


  const existingGallery =
    document.getElementById('existingGallery');


  const existingGalleryGrid =
    document.getElementById('existingGalleryGrid');


  let editingId = null;

  let currentImageUrl = '';



  /* ========================= */
  /* ПРОВЕРКА НА ВХОДА */
  /* ========================= */

  const {
    data: { session }
  } = await supabase.auth.getSession();


  if (!session) {

    window.location.href =
      'index.html';

  }



  /* ========================= */
  /* HTML ESCAPE */
  /* ========================= */

  function escapeHtml(value) {

    if (!value) return '';

    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }



  /* ========================= */
  /* ДАТА */
  /* ========================= */

  function formatDate(dateString) {

    if (!dateString) return '';

    const date =
      new Date(dateString);

    return date.toLocaleDateString(
      'bg-BG',
      {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      }
    );

  }



  /* ========================= */
  /* ПРЕГЛЕД НА НОВА СНИМКА */
  /* ========================= */

  imageFile.addEventListener(
    'change',
    function() {

      const file =
        this.files[0];

      if (!file) {

        imagePreview.style.display =
          'none';

        imagePreviewImage.src =
          '';

        return;

      }


      if (!file.type.startsWith('image/')) {

        message.textContent =
          'Моля, избери файл с изображение.';

        this.value = '';

        imagePreview.style.display =
          'none';

        return;

      }


      const previewUrl =
        URL.createObjectURL(file);


      imagePreviewImage.src =
        previewUrl;


      imagePreview.style.display =
        'block';


      message.textContent =
        '';

    }
  );



  /* ========================= */
  /* ПРЕГЛЕД НА ГАЛЕРИЯТА */
  /* ========================= */

  galleryFiles.addEventListener(
    'change',
    function() {

      galleryPreview.innerHTML =
        '';

      const files =
        Array.from(this.files || []);


      if (!files.length) {
        return;
      }


      for (const file of files) {

        if (!file.type.startsWith('image/')) {
          continue;
        }


        const previewUrl =
          URL.createObjectURL(file);


        const item =
          document.createElement('div');

        item.className =
          'gallery-preview-item';


        item.innerHTML = `

          <img
            src="${previewUrl}"
            alt="${escapeHtml(file.name)}"
          >

          <div class="gallery-preview-name">
            ${escapeHtml(file.name)}
          </div>

        `;


        galleryPreview.appendChild(item);

      }

    }
  );



  /* ========================= */
  /* КАЧВАНЕ НА СНИМКА */
  /* ========================= */

  async function uploadImage(file) {

    if (!file) {
      return null;
    }


    if (!file.type.startsWith('image/')) {

      throw new Error(
        'Избраният файл не е изображение.'
      );

    }


    const allowedTypes = [
      'image/jpeg',
      'image/png',
      'image/webp',
      'image/gif'
    ];


    if (!allowedTypes.includes(file.type)) {

      throw new Error(
        'Позволени са JPG, PNG, WEBP и GIF изображения.'
      );

    }


    const maxSize =
      10 * 1024 * 1024;


    if (file.size > maxSize) {

      throw new Error(
        'Снимката е прекалено голяма. Максималният размер е 10 MB.'
      );

    }


    const extension =
      file.name.includes('.')
        ? file.name
            .split('.')
            .pop()
            .toLowerCase()
        : 'jpg';


    const safeExtension =
      extension === 'jpeg'
        ? 'jpg'
        : extension;


    const uniqueName =
      Date.now() +
      '-' +
      crypto.randomUUID() +
      '.' +
      safeExtension;


    const filePath =
      'news/' +
      uniqueName;


    const {
      data,
      error
    } = await supabase

      .storage

      .from(STORAGE_BUCKET)

      .upload(
        filePath,
        file,
        {
          cacheControl: '31536000',
          contentType: file.type,
          upsert: false
        }
      );


    if (error) {

      console.error(
        'Storage upload error:',
        error
      );

      throw new Error(
        'Снимката не можа да бъде качена: ' +
        error.message
      );

    }


    const {
      data: publicData
    } =
      supabase

        .storage

        .from(STORAGE_BUCKET)

        .getPublicUrl(
          data.path
        );


    if (
      !publicData ||
      !publicData.publicUrl
    ) {

      throw new Error(
        'Снимката е качена, но не беше получен публичен URL.'
      );

    }


    return publicData.publicUrl;

  }



  /* ========================= */
  /* КАЧВАНЕ НА ГАЛЕРИЯ */
  /* ========================= */

  async function uploadGalleryImages(
    newsId,
    files
  ) {

    const selectedFiles =
      Array.from(files || []);


    if (!selectedFiles.length) {
      return;
    }


    for (
      let index = 0;
      index < selectedFiles.length;
      index++
    ) {

      const file =
        selectedFiles[index];


      message.textContent =
        `Качване на допълнителна снимка ${index + 1} от ${selectedFiles.length}...`;


      const imageUrl =
        await uploadImage(file);


      const {
        error
      } = await supabase

        .from('news_images')

        .insert({

          news_id:
            newsId,

          image_url:
            imageUrl,

          sort_order:
            index

        });


      if (error) {

        console.error(
          'Gallery database error:',
          error
        );

        throw new Error(
          'Снимката е качена, но не можа да бъде добавена към галерията: ' +
          error.message
        );

      }

    }

  }



  /* ========================= */
  /* ЗАРЕЖДАНЕ НА ГАЛЕРИЯ */
  /* ========================= */

  async function loadGallery(
    newsId
  ) {

    existingGallery.style.display =
      'none';

    existingGalleryGrid.innerHTML =
      '';


    if (!newsId) {
      return;
    }


    const {
      data,
      error
    } = await supabase

      .from('news_images')

      .select(`
        id,
        image_url,
        sort_order,
        created_at
      `)

      .eq(
        'news_id',
        newsId
      )

      .order(
        'sort_order',
        {
          ascending: true
        }
      )
      .order(
        'created_at',
        {
          ascending: true
        }
      );


    if (error) {

      console.error(
        'Gallery load error:',
        error
      );

      return;

    }


    if (!data || data.length === 0) {
      return;
    }


    data.forEach(
      (image, index) => {

        const item =
          document.createElement('div');

        item.className =
          'existing-gallery-item';


        item.innerHTML = `

          <img
            src="${escapeHtml(image.image_url)}"
            alt="Допълнителна снимка ${index + 1}"
          >

          <div class="existing-gallery-caption">
            Снимка ${index + 1}
          </div>

        `;


        existingGalleryGrid.appendChild(item);

      }
    );


    existingGallery.style.display =
      'block';

  }



  /* ========================= */
  /* ЗАРЕЖДАНЕ НА НОВИНИТЕ */
  /* ========================= */

  async function loadNews() {

    newsList.innerHTML =
      '<div class="loading">Зареждане на новините...</div>';


    const {
      data,
      error
    } = await supabase

      .from('news')

      .select(`
        id,
        title,
        subtitle,
        category,
        image_url,
        content,
        author,
        is_featured,
        views,
        status,
        created_at,
        updated_at
      `)

      .eq('status', 'published')

      .order(
        'created_at',
        {
          ascending: false
        }
      );


    if (error) {

      console.error(error);

      newsList.innerHTML =
        '<div class="empty">Грешка при зареждането на новините.</div>';

      return;

    }


    if (!data || data.length === 0) {

      newsList.innerHTML =
        '<div class="empty">Все още няма публикувани новини.</div>';

      return;

    }


    newsList.innerHTML =
      data.map(news => {

        const image =
          news.image_url ||
          'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=600&q=80';


        return `

          <div class="news-item">

            <img
              class="news-thumb"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(news.title)}"
            >


            <div class="news-info">

              <div class="news-title">
                ${escapeHtml(news.title)}
              </div>


              <div class="news-meta">

                ${escapeHtml(news.category || 'Новини')}
                &nbsp; • &nbsp;
                ${formatDate(news.created_at)}

                ${
                  news.views
                  ? ` &nbsp; • &nbsp; ${news.views} преглеждания`
                  : ''
                }

              </div>


              ${
                news.subtitle
                ? `

                  <div class="news-subtitle">
                    ${escapeHtml(news.subtitle)}
                  </div>

                `
                : ''
              }


              ${
                news.is_featured
                ? `

                  <span class="featured-label">
                    ⭐ Избрана новина
                  </span>

                `
                : ''
              }

            </div>


            <div class="news-actions">

              <button
                class="edit-button"
                data-id="${news.id}"
              >
                ✏️ Редактирай
              </button>


              <button
                class="delete-button"
                data-id="${news.id}"
              >
                🗑️ Изтрий
              </button>

            </div>

          </div>

        `;

      }).join('');



    /* ========================= */
    /* БУТОНИ РЕДАКТИРАНЕ */
    /* ========================= */

    document
      .querySelectorAll('.edit-button')
      .forEach(button => {

        button.addEventListener(
          'click',
          function() {

            const id =
              this.dataset.id;

            startEdit(id);

          }
        );

      });



    /* ========================= */
    /* БУТОНИ ИЗТРИВАНЕ */
    /* ========================= */

    document
      .querySelectorAll('.delete-button')
      .forEach(button => {

        button.addEventListener(
          'click',
          function() {

            const id =
              this.dataset.id;

            deleteNews(id);

          }
        );

      });

  }



  /* ========================= */
  /* РЕДАКТИРАНЕ */
  /* ========================= */

  async function startEdit(id) {

    message.textContent =
      'Зареждане на новината...';


    const {
      data,
      error
    } = await supabase

      .from('news')

      .select(`
        id,
        title,
        subtitle,
        category,
        image_url,
        content,
        author,
        is_featured,
        status
      `)

      .eq('id', id)

      .single();


    if (error) {

      console.error(error);

      message.textContent =
        'Грешка при зареждането на новината.';

      return;

    }


    editingId =
      data.id;


    currentImageUrl =
      data.image_url || '';


    document.getElementById('title').value =
      data.title || '';


    document.getElementById('subtitle').value =
      data.subtitle || '';


    document.getElementById('category').value =
      data.category || '';


    document.getElementById('content').value =
      data.content || '';


    document.getElementById('author').value =
      data.author || 'СПИСАНИЕТО.';


    document.getElementById('is_featured').checked =
      data.is_featured === true;


    imageFile.value =
      '';


    galleryFiles.value =
      '';


    galleryPreview.innerHTML =
      '';


    imagePreview.style.display =
      'none';


    imagePreviewImage.src =
      '';


    if (currentImageUrl) {

      currentImagePreview.src =
        currentImageUrl;

      currentImage.style.display =
        'block';

    } else {

      currentImagePreview.src =
        '';

      currentImage.style.display =
        'none';

    }


    await loadGallery(
      data.id
    );


    formTitle.textContent =
      'Редактиране на новина';


    saveButton.textContent =
      'Запази промените';


    cancelEdit.style.display =
      'inline-block';


    message.textContent =
      '';


    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });

  }



  /* ========================= */
  /* ОТКАЗ ОТ РЕДАКТИРАНЕ */
  /* ========================= */

  cancelEdit.addEventListener(
    'click',
    function() {

      resetForm();

    }
  );



  function resetForm() {

    editingId = null;

    currentImageUrl = '';


    form.reset();


    document.getElementById('author').value =
      'СПИСАНИЕТО.';


    document.getElementById('is_featured').checked =
      false;


    imageFile.value =
      '';


    galleryFiles.value =
      '';


    galleryPreview.innerHTML =
      '';


    imagePreview.style.display =
      'none';


    imagePreviewImage.src =
      '';


    currentImage.style.display =
      'none';


    currentImagePreview.src =
      '';


    existingGallery.style.display =
      'none';


    existingGalleryGrid.innerHTML =
      '';


    formTitle.textContent =
      'Нова новина';


    saveButton.textContent =
      'Запази новината';


    cancelEdit.style.display =
      'none';


    message.textContent =
      '';

  }



  /* ========================= */
  /* ЗАПАЗВАНЕ */
  /* ========================= */

  form.addEventListener(
    'submit',
    async function(event) {

      event.preventDefault();


      saveButton.disabled =
        true;


      message.textContent =
        editingId
        ? 'Запазване на промените...'
        : 'Публикуване...';


      const title =
        document
          .getElementById('title')
          .value
          .trim();


      const subtitle =
        document
          .getElementById('subtitle')
          .value
          .trim();


      const category =
        document
          .getElementById('category')
          .value;


      const content =
        document
          .getElementById('content')
          .value
          .trim();


      const author =
        document
          .getElementById('author')
          .value
          .trim();


      const is_featured =
        document
          .getElementById('is_featured')
          .checked;


      try {

        /* ========================= */
        /* НОВА ОСНОВНА СНИМКА */
        /* ========================= */

        const selectedFile =
          imageFile.files[0];


        let image_url =
          currentImageUrl || null;


        if (selectedFile) {

          message.textContent =
            'Качване на основната снимка...';


          image_url =
            await uploadImage(
              selectedFile
            );

        }



        /* ========================= */
        /* РЕДАКЦИЯ */
        /* ========================= */

        if (editingId) {

          const {
            error
          } = await supabase

            .from('news')

            .update({

              title: title,

              subtitle: subtitle,

              category: category,

              image_url:
                image_url,

              content: content,

              author:
                author || 'СПИСАНИЕТО.',

              is_featured:
                is_featured,

              updated_at:
                new Date().toISOString()

            })

            .eq(
              'id',
              editingId
            );


          if (error) {

            console.error(error);

            throw new Error(
              'Грешка при редактирането: ' +
              error.message
            );

          }


          /* ========================= */
          /* ДОБАВЯНЕ НА НОВИ СНИМКИ */
          /* ========================= */

          const selectedGalleryFiles =
            galleryFiles.files;


          if (
            selectedGalleryFiles &&
            selectedGalleryFiles.length
          ) {

            await uploadGalleryImages(
              editingId,
              selectedGalleryFiles
            );

          }


          message.textContent =
            'Новината е редактирана успешно!';


          resetForm();


          await loadNews();


          return;

        }



        /* ========================= */
        /* НОВА НОВИНА */
        /* ========================= */

        const {
          data: insertedNews,
          error
        } = await supabase

          .from('news')

          .insert({

            title: title,

            subtitle: subtitle,

            category: category,

            image_url:
              image_url,

            content: content,

            author:
              author || 'СПИСАНИЕТО.',

            status:
              'published',

            is_featured:
              is_featured,

            views:
              0

          })

          .select('id')

          .single();


        if (error) {

          console.error(error);

          throw new Error(
            'Грешка при публикуването: ' +
            error.message
          );

        }


        /* ========================= */
        /* ДОПЪЛНИТЕЛНИ СНИМКИ */
        /* ========================= */

        const selectedGalleryFiles =
          galleryFiles.files;


        if (
          selectedGalleryFiles &&
          selectedGalleryFiles.length
        ) {

          await uploadGalleryImages(
            insertedNews.id,
            selectedGalleryFiles
          );

        }


        message.textContent =
          'Новината е публикувана успешно!';


        resetForm();


        await loadNews();

      } catch (error) {

        console.error(error);

        message.textContent =
          error.message ||
          'Възникна грешка.';

      } finally {

        saveButton.disabled =
          false;

      }

    }
  );



  /* ========================= */
  /* ИЗТРИВАНЕ */
  /* ========================= */

  async function deleteNews(id) {

    const confirmed =
      confirm(
        'Сигурни ли сте, че искате да изтриете тази новина?'
      );


    if (!confirmed) {
      return;
    }


    const {
      error
    } = await supabase

      .from('news')

      .delete()

      .eq(
        'id',
        id
      );


    if (error) {

      console.error(error);

      alert(
        'Грешка при изтриването: ' +
        error.message
      );

      return;

    }


    if (editingId === id) {

      resetForm();

    }


    await loadNews();

  }



  /* ========================= */
  /* ИЗХОД */
  /* ========================= */

  logout.addEventListener(
    'click',
    async function() {

      await supabase.auth.signOut();

      window.location.href =
        'index.html';

    }
  );



  /* ========================= */
  /* ПЪРВОНАЧАЛНО ЗАРЕЖДАНЕ */
  /* ========================= */

  await loadNews();

</script>

</body>
</html>
