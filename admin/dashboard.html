<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Администрация – СПИСАНИЕТО.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f4ef;
      color: #171717;
      font-family: Arial, sans-serif;
    }

    header {
      background: #111;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 28px;
    }

    #logout {
      background: transparent;
      border: 1px solid #fff;
      color: white;
      padding: 9px 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }

    h2 {
      font-family: Georgia, serif;
      margin-top: 0;
      font-size: 30px;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 300px;
      resize: vertical;
    }

    button.save {
      margin-top: 25px;
      background: #8c1d40;
      color: white;
      border: 0;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>СПИСАНИЕТО.</h1>
  <button id="logout">Изход</button>
</header>

<main>

  <div class="panel">

    <h2>Нова новина</h2>

    <form id="newsForm">

      <label for="title">Заглавие</label>
      <input
        type="text"
        id="title"
        placeholder="Въведете заглавие"
        required
      >

      <label for="subtitle">Подзаглавие</label>
      <input
        type="text"
        id="subtitle"
        placeholder="Въведете подзаглавие"
      >

      <label for="category">Категория</label>
      <select id="category" required>
        <option value="">Изберете категория</option>
        <option value="Новини">Новини</option>
        <option value="Политика">Политика</option>
        <option value="Свят">Свят</option>
        <option value="Анализи">Анализи</option>
        <option value="Лайфстайл">Лайфстайл</option>
        <option value="Технологии">Технологии</option>
        <option value="Икономика">Икономика</option>
      </select>

      <label for="image_url">URL на снимката</label>
      <input
        type="url"
        id="image_url"
        placeholder="https://..."
      >

      <label for="content">Текст на новината</label>
      <textarea
        id="content"
        placeholder="Напишете текста на новината..."
        required
      ></textarea>

      <label for="author">Автор</label>
      <input
        type="text"
        id="author"
        value="СПИСАНИЕТО."
      >

      <button type="submit" class="save">
        Запази новината
      </button>

      <div id="message"></div>

    </form>

  </div>

</main>

<script type="module">

  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL =
    'https://hxvflentlaktgwimsevc.supabase.co';

  const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_waLxhS_U0hYHzlfp016b4g_bwDTjWGY';

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.getElementById('newsForm');
  const message = document.getElementById('message');
  const logout = document.getElementById('logout');

  const {
    data: { session }
  } = await supabase.auth.getSession();

  if (!session) {
    window.location.href = 'index.html';
  }

  form.addEventListener('submit', async function(event) {

    event.preventDefault();

    message.textContent = 'Запазване...';

    const title =
      document.getElementById('title').value.trim();

    const subtitle =
      document.getElementById('subtitle').value.trim();

    const category =
      document.getElementById('category').value;

    const image_url =
      document.getElementById('image_url').value.trim();

    const content =
      document.getElementById('content').value.trim();

    const author =
      document.getElementById('author').value.trim();

    const { error } = await supabase
      .from('news')
      .insert({
        title: title,
        subtitle: subtitle,
        category: category,
        image_url: image_url || null,
        content: content,
        author: author || 'СПИСАНИЕТО.',
        status: 'published',
        is_featured: false,
        views: 0,
        published_at: new Date().toISOString()
      });

    if (error) {
      console.error(error);
      message.textContent =
        'Грешка при записването: ' + error.message;
      return;
    }

    message.textContent =
      'Новината е публикувана успешно!';

    form.reset();

    document.getElementById('author').value =
      'СПИСАНИЕТО.';
  });

  logout.addEventListener('click', async function() {

    await supabase.auth.signOut();

    window.location.href = 'index.html';

  });

</script>

</body>
</html>
