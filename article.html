    <div id="article" style="display:none;">

        <div class="article-meta" id="article-meta"></div>

                class="featured-image"

        </div>


        <div class="article-body" id="article-body"></div>

<script type="module">

import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


const SUPABASE_URL =
    'https://hxvflentlaktgwimsevc.supabase.co';


const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_waLxhS_U0hYHzlfp016b4g_bwDTjWGY';


const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


// Вземаме ID-то от адреса:
// article.html?id=123

const params = new URLSearchParams(
    window.location.search
);

const articleId = params.get('id');


async function loadArticle() {

    const loading =
        document.getElementById('loading');

    const article =
        document.getElementById('article');

    const error =
        document.getElementById('error');


    if (!articleId) {

        loading.style.display = 'none';

        error.textContent =
            'Липсва номер на новината.';

        error.style.display = 'block';

        return;
    }


    const { data, error: supabaseError } =
        await supabase
            .from('news')
            .select(`
                id,
                title,
                subtitle,
                content,
                category,
                author,
                image_url,
                created_at
            `)
            .eq('id', articleId)
            .eq('status', 'published')
            .single();


    if (supabaseError || !data) {

        console.error(
            'Грешка при зареждане:',
            supabaseError
        );

        loading.style.display = 'none';

        error.textContent =
            'Новината не е намерена.';

        error.style.display = 'block';

        return;
    }


    // Заглавие

    document.getElementById(
        'article-title'
    ).textContent =
        data.title || '';


    // Подзаглавие

    const subtitle =
        document.getElementById(
            'article-subheading'
        );

    if (data.subtitle) {

        subtitle.textContent =
            data.subtitle;

    } else {

        subtitle.style.display =
            'none';

    }


    // Категория

    document.getElementById(
        'article-meta'
    ).textContent =
        data.category || 'Новини';


    // Автор

    document.getElementById(
        'article-author'
    ).textContent =
        'Автор: ' +
        (data.author || 'СПИСАНИЕТО.');


    // Дата

    if (data.created_at) {

        const date =
            new Date(data.created_at);

        document.getElementById(
            'article-date'
        ).textContent =
            date.toLocaleDateString(
                'bg-BG',
                {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                }
            );

    }


    // Снимка

    const image =
        document.getElementById(
            'article-image'
        );

    if (data.image_url) {

        image.src =
            data.image_url;

        image.alt =
            data.title || 'СПИСАНИЕТО.';

        document.getElementById(
            'image-caption'
        ).textContent =
            'Снимка: СПИСАНИЕТО.';

    } else {

        image.style.display =
            'none';

        document.getElementById(
            'image-caption'
        ).style.display =
            'none';

    }


    // Основен текст

    const body =
        document.getElementById(
            'article-body'
        );


    if (data.content) {

        // Ако съдържанието е обикновен текст,
        // всеки нов абзац се превръща в <p>.

        const paragraphs =
            data.content
                .split(/\n\s*\n/)
                .map(
                    paragraph =>
                        paragraph.trim()
                )
                .filter(
                    paragraph =>
                        paragraph.length > 0
                );


        body.innerHTML =
            paragraphs
                .map(
                    paragraph =>
                        `<p>${escapeHtml(paragraph)}</p>`
                )
                .join('');

    } else {

        body.innerHTML =
            '<p>Съдържанието на новината не е налично.</p>';

    }


    // Показваме статията

    loading.style.display =
        'none';

    article.style.display =
        'block';


    // Заглавието на браузъра

    document.title =
        data.title +
        ' — СПИСАНИЕТО.';

}


function escapeHtml(text) {

    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


loadArticle();

</script>

</body>
