<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Новина — СПИСАНИЕТО.</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f7f6f2;
            --text-color: #111111;
            --accent-color: #a21f5a;
            --border-color: #e2dfd7;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            line-height: 1.8;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 1.5rem;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-color);
            text-decoration: none;
        }

        .logo-dot {
            color: var(--accent-color);
        }

        .back-link {
            text-decoration: none;
            color: #666;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .back-link:hover {
            color: var(--accent-color);
        }

        .article-container {
            max-width: 820px;
            margin: 3rem auto 5rem;
            padding: 0 1.5rem;
        }

        .article-meta {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 0.8rem;
        }

        .article-title {
            font-family: var(--font-serif);
            font-size: 3.2rem;
            font-weight: 600;
            line-height: 1.15;
            margin-bottom: 1.2rem;
            letter-spacing: -0.5px;
        }

        .article-subheading {
            font-family: var(--font-serif);
            font-size: 1.35rem;
            font-style: italic;
            color: #444;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .author-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 0.8rem 0;
            margin-bottom: 2.5rem;
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .featured-image-wrap {
            margin-bottom: 3rem;
        }

        .featured-image {
            width: 100%;
            height: 480px;
            object-fit: cover;
            border-radius: 2px;
            display: block;
        }

        .image-caption {
            font-size: 0.8rem;
            color: #777;
            margin-top: 0.6rem;
            text-align: center;
            font-style: italic;
        }

        .article-body {
            font-size: 1.1rem;
            color: #222;
        }

        .article-body p {
            margin-bottom: 1.8rem;
        }

        .article-body strong,
        .article-body b {
            font-weight: 700;
        }

        .article-body em,
        .article-body i {
            font-style: italic;
        }

        .article-body a {
            color: var(--accent-color);
            text-decoration: underline;
        }

        .article-body a:hover {
            opacity: 0.75;
        }

        .article-body ul,
        .article-body ol {
            margin: 0 0 1.8rem 1.8rem;
        }

        .article-body li {
            margin-bottom: 0.5rem;
        }

        .article-body p:first-of-type::first-letter {
            font-family: var(--font-serif);
            font-size: 4.2rem;
            float: left;
            line-height: 0.8;
            margin-right: 0.8rem;
            margin-top: 0.2rem;
            color: var(--accent-color);
        }

        blockquote {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-style: italic;
            line-height: 1.3;
            color: var(--text-color);
            border-left: 2px solid var(--accent-color);
            padding-left: 1.5rem;
            margin: 2.5rem 0;
        }

        /* ==========================================
           ГАЛЕРИЯ
           ========================================== */

        .article-gallery {
            margin-top: 3rem;
            margin-bottom: 3rem;
        }

        .gallery-title {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            color: var(--text-color);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .gallery-item {
            display: block;
            overflow: hidden;
            border-radius: 2px;
            background: #eee;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.03);
        }

        /* ==========================================
           LIGHTBOX
           ========================================== */

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 2rem;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-image {
            max-width: 95vw;
            max-height: 90vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 42px;
            height: 42px;
            border: none;
            background: transparent;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        .lightbox-close:hover {
            color: var(--accent-color);
        }

        /* СПОДЕЛЯНЕ */

        .share-box {
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-top: 3rem;
            padding: 1.5rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .share-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #666;
            font-weight: 600;
        }

        .share-buttons {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .share-button {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            border-radius: 50%;
        }

        .share-button:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .share-button.facebook:hover {
            background: #1877f2;
            border-color: #1877f2;
        }

        .share-button.messenger:hover {
            background: #0084ff;
            border-color: #0084ff;
        }

        .share-button.viber:hover {
            background: #665cac;
            border-color: #665cac;
        }

        .share-button.whatsapp:hover {
            background: #25d366;
            border-color: #25d366;
        }

        .share-button.x:hover {
            background: #111;
            border-color: #111;
        }

        .share-button.telegram:hover {
            background: #229ED9;
            border-color: #229ED9;
        }

        .message {
            text-align: center;
            padding: 5rem 1rem;
            font-size: 1rem;
            color: #777;
        }

        .error-message {
            color: var(--accent-color);
        }

        footer {
            text-align: center;
            padding: 3rem 1rem;
            border-top: 1px solid var(--border-color);
            color: #777;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {

            .article-title {
                font-size: 2.2rem;
            }

            .featured-image {
                height: 300px;
            }

            .article-container {
                margin-top: 1.5rem;
            }

            .author-box {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.3rem;
            }

            .share-box {
                flex-direction: column;
                align-items: flex-start;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .gallery-item img {
                height: 240px;
            }
        }
    </style>
</head>

<script type="module">

import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

import DOMPurify from
    'https://cdn.jsdelivr.net/npm/dompurify@3.2.6/+esm';


const SUPABASE_URL =
    'https://hxvflentlaktgwimsevc.supabase.co';


const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_waLxhS_U0hYHzlfp016b4g_bwDTjWGY';


const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


// Вземаме ID-то от адреса:
// article.html?id=123

const params = new URLSearchParams(
    window.location.search
);

const articleId = params.get('id');


// ==========================================
// БЕЗОПАСНО HTML САНИТИЗИРАНЕ
// ==========================================

function sanitizeArticleHtml(html) {

    return DOMPurify.sanitize(
        html || '',
        {
            ALLOWED_TAGS: [
                'p',
                'br',
                'strong',
                'b',
                'em',
                'i',
                'a',
                'ul',
                'ol',
                'li',
                'blockquote'
            ],

            ALLOWED_ATTR: [
                'href',
                'target',
                'rel'
            ],

            ALLOW_DATA_ATTR: false
        }
    );

}


// ==========================================
// СТАРИЯТ ФОРМАТ НА ТЕКСТА
// ==========================================

function plainTextToHtml(text) {

    if (!text) {
        return '';
    }

    return text
        .split(/\n\s*\n/)
        .map(
            paragraph =>
                paragraph.trim()
        )
        .filter(
            paragraph =>
                paragraph.length > 0
        )
        .map(
            paragraph =>
                `<p>${escapeHtml(paragraph)}</p>`
        )
        .join('');

}


async function loadArticle() {

    const loading =
        document.getElementById('loading');

    const article =
        document.getElementById('article');

    const error =
        document.getElementById('error');


    if (!articleId) {

        loading.style.display = 'none';

        error.textContent =
            'Липсва номер на новината.';

        error.style.display = 'block';

        return;
    }


    const { data, error: supabaseError } =
        await supabase
            .from('news')
            .select(`
                id,
                title,
                subtitle,
                content,
                content_html,
                category,
                image_url,
                created_at,
                views
            `)
            .eq('id', articleId)
            .eq('status', 'published')
            .single();


    if (supabaseError || !data) {

        console.error(
            'Грешка при зареждане:',
            supabaseError
        );

        loading.style.display = 'none';

        error.textContent =
            'Новината не е намерена.';

        error.style.display = 'block';

        return;
    }


    // ==========================================
    // ЗАГЛАВИЕ
    // ==========================================

    document.getElementById(
        'article-title'
    ).textContent =
        data.title || '';


    // ==========================================
    // ПОДЗАГЛАВИЕ
    // ==========================================

    const subtitle =
        document.getElementById(
            'article-subheading'
        );

    if (data.subtitle) {

        subtitle.textContent =
            data.subtitle;

    } else {

        subtitle.style.display =
            'none';

    }


    // ==========================================
    // КАТЕГОРИЯ
    // ==========================================

    document.getElementById(
        'article-meta'
    ).textContent =
        data.category || 'Новини';


    // ==========================================
    // АВТОР
    // ==========================================

    document.getElementById(
        'article-author'
    ).textContent =
        'Автор: СПИСАНИЕТО.';


    // ==========================================
    // ДАТА
    // ==========================================

    let formattedDate = '';

    if (data.created_at) {

        const date =
            new Date(data.created_at);

        formattedDate =
            date.toLocaleDateString(
                'bg-BG',
                {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                }
            );

    }


    // ==========================================
    // БРОЙ ПРОЧИТАНИЯ
    // ==========================================

    let currentViews =
        Number(data.views) || 0;


    const {
        error: viewsError
    } =
        await supabase.rpc(
            'increment_news_views',
            {
                news_id: Number(articleId)
            }
        );


    if (viewsError) {

        console.error(
            'Грешка при увеличаване на views:',
            viewsError
        );

    } else {

        currentViews++;

        console.log(
            'Гледането е отчетено успешно.'
        );

    }


    document.getElementById(
        'article-date'
    ).textContent =
        formattedDate +
        ' · 👁 ' +
        currentViews;


    // ==========================================
    // ОСНОВНА СНИМКА
    // ==========================================

    const image =
        document.getElementById(
            'article-image'
        );

    if (data.image_url) {

        image.src =
            data.image_url;

        image.alt =
            data.title || 'СПИСАНИЕТО.';

    } else {

        image.style.display =
            'none';

    }


    // ==========================================
    // ОСНОВЕН ТЕКСТ
    // ==========================================

    const body =
        document.getElementById(
            'article-body'
        );


    /*
       Новите новини използват content_html.

       Ако content_html съществува,
       показваме форматирания текст.

       Ако е стара новина и няма content_html,
       използваме старото поле content.
    */

    if (
        data.content_html &&
        data.content_html.trim()
    ) {

        body.innerHTML =
            sanitizeArticleHtml(
                data.content_html
            );

    } else if (data.content) {

        body.innerHTML =
            plainTextToHtml(
                data.content
            );

    } else {

        body.innerHTML =
            '<p>Съдържанието на новината не е налично.</p>';

    }


    // ==========================================
    // ГАЛЕРИЯ ОТ ДОПЪЛНИТЕЛНИ СНИМКИ
    // ==========================================

    const gallery =
        document.getElementById(
            'article-gallery'
        );

    const galleryGrid =
        document.getElementById(
            'gallery-grid'
        );


    const {
        data: galleryImages,
        error: galleryError
    } =
        await supabase
            .from('news_images')
            .select(`
                id,
                image_url,
                sort_order
            `)
            .eq(
                'news_id',
                Number(articleId)
            )
            .order(
                'sort_order',
                {
                    ascending: true
                }
            );


    if (galleryError) {

        console.error(
            'Грешка при зареждане на галерията:',
            galleryError
        );

    }


    if (
        !galleryError &&
        galleryImages &&
        galleryImages.length > 0
    ) {

        galleryGrid.innerHTML =
            galleryImages
                .map(
                    item => `
                        <a
                            href="${escapeHtml(item.image_url)}"
                            class="gallery-item"
                            data-gallery-image="${escapeHtml(item.image_url)}"
                        >
                            <img
                                src="${escapeHtml(item.image_url)}"
                                alt="Допълнителна снимка"
                                loading="lazy"
                            >
                        </a>
                    `
                )
                .join('');


        gallery.style.display =
            'block';


        document
            .querySelectorAll('.gallery-item')
            .forEach(
                item => {

                    item.addEventListener(
                        'click',
                        function(event) {

                            event.preventDefault();

                            openLightbox(
                                this.dataset.galleryImage
                            );

                        }
                    );

                }
            );

    }


    // ==========================================
    // СПОДЕЛЯНЕ В СОЦИАЛНИ МРЕЖИ
    // ==========================================

    const articleUrl =
        window.location.href;


    const encodedTitle =
        encodeURIComponent(
            data.title || 'СПИСАНИЕТО.'
        );


    const encodedArticleUrl =
        encodeURIComponent(
            articleUrl
        );


    // ==========================================
    // FACEBOOK
    // ==========================================

    const sharePreviewUrl =
        'https://spisanieto-share.mklimentieva.workers.dev/?id=' +
        encodeURIComponent(articleId);


    const encodedSharePreviewUrl =
        encodeURIComponent(
            sharePreviewUrl
        );


    document.getElementById(
        'share-facebook'
    ).href =
        'https://www.facebook.com/sharer/sharer.php?u=' +
        encodedSharePreviewUrl;


    // ==========================================
    // MESSENGER
    // ==========================================

    document.getElementById(
        'share-messenger'
    ).href =
        'https://www.facebook.com/dialog/send?link=' +
        encodedArticleUrl;


    // ==========================================
    // VIBER
    // ==========================================

    document.getElementById(
        'share-viber'
    ).href =
        'viber://forward?text=' +
        encodedTitle +
        '%20' +
        encodedArticleUrl;


    // ==========================================
    // WHATSAPP
    // ==========================================

    document.getElementById(
        'share-whatsapp'
    ).href =
        'https://api.whatsapp.com/send?text=' +
        encodedTitle +
        '%20' +
        encodedArticleUrl;


    // ==========================================
    // X
    // ==========================================

    document.getElementById(
        'share-x'
    ).href =
        'https://twitter.com/intent/tweet?text=' +
        encodedTitle +
        '&url=' +
        encodedArticleUrl;


    // ==========================================
    // TELEGRAM
    // ==========================================

    document.getElementById(
        'share-telegram'
    ).href =
        'https://t.me/share/url?url=' +
        encodedArticleUrl +
        '&text=' +
        encodedTitle;


    // ==========================================
    // ПОКАЗВАМЕ СТАТИЯТА
    // ==========================================

    loading.style.display =
        'none';

    article.style.display =
        'block';


    document.title =
        data.title +
        ' — СПИСАНИЕТО.';

}


// ==========================================
// LIGHTBOX
// ==========================================

const lightbox =
    document.getElementById(
        'lightbox'
    );

const lightboxImage =
    document.getElementById(
        'lightbox-image'
    );

const lightboxClose =
    document.getElementById(
        'lightbox-close'
    );


function openLightbox(imageUrl) {

    lightboxImage.src =
        imageUrl;

    lightbox.classList.add(
        'active'
    );

    lightbox.setAttribute(
        'aria-hidden',
        'false'
    );

    document.body.style.overflow =
        'hidden';

}


function closeLightbox() {

    lightbox.classList.remove(
        'active'
    );

    lightbox.setAttribute(
        'aria-hidden',
        'true'
    );

    lightboxImage.src =
        '';

    document.body.style.overflow =
        '';

}


lightboxClose.addEventListener(
    'click',
    closeLightbox
);


lightbox.addEventListener(
    'click',
    function(event) {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);


document.addEventListener(
    'keydown',
    function(event) {

        if (
            event.key === 'Escape'
        ) {

            closeLightbox();

        }

    }
);


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHtml(text) {

    return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


loadArticle();
