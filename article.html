<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Новина — СПИСАНИЕТО.</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f7f6f2;
            --text-color: #111111;
            --accent-color: #8c1d40;
            --border-color: #e2dfd7;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            line-height: 1.8;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 1.5rem;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-color);
            text-decoration: none;
        }

        .back-link {
            text-decoration: none;
            color: #666;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .back-link:hover {
            color: var(--accent-color);
        }

        .article-container {
            max-width: 820px;
            margin: 3rem auto 5rem;
            padding: 0 1.5rem;
        }

        .article-meta {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 0.8rem;
        }

        .article-title {
            font-family: var(--font-serif);
            font-size: 3.2rem;
            font-weight: 600;
            line-height: 1.15;
            margin-bottom: 1.2rem;
            letter-spacing: -0.5px;
        }

        .article-subheading {
            font-family: var(--font-serif);
            font-size: 1.35rem;
            font-style: italic;
            color: #444;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .author-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 0.8rem 0;
            margin-bottom: 2.5rem;
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .featured-image-wrap {
            margin-bottom: 3rem;
        }

        .featured-image {
            width: 100%;
            height: 480px;
            object-fit: cover;
            border-radius: 2px;
            display: block;
        }

        .image-caption {
            font-size: 0.8rem;
            color: #777;
            margin-top: 0.6rem;
            text-align: center;
            font-style: italic;
        }

        .article-body {
            font-size: 1.1rem;
            color: #222;
        }

        .article-body p {
            margin-bottom: 1.8rem;
        }

        .article-body p:first-of-type::first-letter {
            font-family: var(--font-serif);
            font-size: 4.2rem;
            float: left;
            line-height: 0.8;
            margin-right: 0.8rem;
            margin-top: 0.2rem;
            color: var(--accent-color);
        }

        blockquote {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-style: italic;
            line-height: 1.3;
            color: var(--text-color);
            border-left: 2px solid var(--accent-color);
            padding-left: 1.5rem;
            margin: 2.5rem 0;
        }

        /* СПОДЕЛЯНЕ */

        .share-box {
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-top: 3rem;
            padding: 1.5rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .share-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #666;
            font-weight: 600;
        }

        .share-buttons {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .share-button {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            border-radius: 50%;
        }

        .share-button:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .share-button.facebook:hover {
            background: #1877f2;
            border-color: #1877f2;
        }

        .share-button.messenger:hover {
            background: #0084ff;
            border-color: #0084ff;
        }

        .share-button.viber:hover {
            background: #665cac;
            border-color: #665cac;
        }

        .share-button.whatsapp:hover {
            background: #25d366;
            border-color: #25d366;
        }

        .share-button.x:hover {
            background: #111;
            border-color: #111;
        }

        .message {
            text-align: center;
            padding: 5rem 1rem;
            font-size: 1rem;
            color: #777;
        }

        .error-message {
            color: var(--accent-color);
        }

        footer {
            text-align: center;
            padding: 3rem 1rem;
            border-top: 1px solid var(--border-color);
            color: #777;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {

            .article-title {
                font-size: 2.2rem;
            }

            .featured-image {
                height: 300px;
            }

            .article-container {
                margin-top: 1.5rem;
            }

            .author-box {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.3rem;
            }

            .share-box {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">

        <a href="index.html" class="back-link">
            ← Назад към началната
        </a>

        <a href="index.html" class="logo">
            СПИСАНИЕТО.
        </a>

        <span style="width: 100px;"></span>

    </div>
</header>


<main class="article-container">

    <div id="loading" class="message">
        Зареждане на новината...
    </div>


    <div id="article" style="display:none;">

        <div class="article-meta" id="article-meta"></div>

        <h1 class="article-title" id="article-title"></h1>

        <p class="article-subheading" id="article-subheading"></p>


        <div class="author-box">

            <span id="article-author"></span>

            <span id="article-date"></span>

        </div>


        <div class="featured-image-wrap">

            <img
                id="article-image"
                class="featured-image"
                alt=""
            >

        </div>


        <div class="article-body" id="article-body"></div>


        <!-- БУТОНИ ЗА СПОДЕЛЯНЕ -->

        <div class="share-box">

            <div class="share-title">
                Сподели новината
            </div>

            <div class="share-buttons">

                <a
                    id="share-facebook"
                    class="share-button facebook"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Сподели във Facebook"
                >
                    f
                </a>

                <a
                    id="share-messenger"
                    class="share-button messenger"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Сподели в Messenger"
                >
                    m
                </a>

                <a
                    id="share-viber"
                    class="share-button viber"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Сподели във Viber"
                >
                    v
                </a>

                <a
                    id="share-whatsapp"
                    class="share-button whatsapp"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Сподели в WhatsApp"
                >
                    w
                </a>

                <a
                    id="share-x"
                    class="share-button x"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Сподели в X"
                >
                    𝕏
                </a>

            </div>

        </div>

    </div>


    <div id="error" class="message error-message" style="display:none;">

        Новината не може да бъде заредена.

    </div>

</main>


<footer>

    &copy; 2026 СПИСАНИЕТО. Всички права запазени.

</footer>


<script type="module">

import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


const SUPABASE_URL =
    'https://hxvflentlaktgwimsevc.supabase.co';


const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_waLxhS_U0hYHzlfp016b4g_bwDTjWGY';


const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


// Вземаме ID-то от адреса:
// article.html?id=123

const params = new URLSearchParams(
    window.location.search
);

const articleId = params.get('id');


async function loadArticle() {

    const loading =
        document.getElementById('loading');

    const article =
        document.getElementById('article');

    const error =
        document.getElementById('error');


    if (!articleId) {

        loading.style.display = 'none';

        error.textContent =
            'Липсва номер на новината.';

        error.style.display = 'block';

        return;
    }


    const { data, error: supabaseError } =
        await supabase
            .from('news')
            .select(`
                id,
                title,
                subtitle,
                content,
                category,
                image_url,
                created_at,
                views
            `)
            .eq('id', articleId)
            .eq('status', 'published')
            .single();


    if (supabaseError || !data) {

        console.error(
            'Грешка при зареждане:',
            supabaseError
        );

        loading.style.display = 'none';

        error.textContent =
            'Новината не е намерена.';

        error.style.display = 'block';

        return;
    }


    // Заглавие

    document.getElementById(
        'article-title'
    ).textContent =
        data.title || '';


    // Подзаглавие

    const subtitle =
        document.getElementById(
            'article-subheading'
        );

    if (data.subtitle) {

        subtitle.textContent =
            data.subtitle;

    } else {

        subtitle.style.display =
            'none';

    }


    // Категория

    document.getElementById(
        'article-meta'
    ).textContent =
        data.category || 'Новини';


    // Автор
    // Винаги СПИСАНИЕТО.

    document.getElementById(
        'article-author'
    ).textContent =
        'Автор: СПИСАНИЕТО.';


    // Дата

    let formattedDate = '';

    if (data.created_at) {

        const date =
            new Date(data.created_at);

        formattedDate =
            date.toLocaleDateString(
                'bg-BG',
                {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                }
            );

    }


    // Брой прочитания преди текущото отваряне

    let currentViews =
        Number(data.views) || 0;


    // Увеличаваме броя на гледанията

    const {
        error: viewsError
    } =
        await supabase.rpc(
            'increment_news_views',
            {
                news_id: Number(articleId)
            }
        );


    if (viewsError) {

        console.error(
            'Грешка при увеличаване на views:',
            viewsError
        );

    } else {

        // Текущото отваряне вече е отчетено
        currentViews++;

        console.log(
            'Гледането е отчетено успешно.'
        );

    }


    // Дата + само числото на прочитанията

    document.getElementById(
        'article-date'
    ).textContent =
        formattedDate +
        ' · 👁 ' +
        currentViews;


    // Снимка

    const image =
        document.getElementById(
            'article-image'
        );

    if (data.image_url) {

        image.src =
            data.image_url;

        image.alt =
            data.title || 'СПИСАНИЕТО.';

    } else {

        image.style.display =
            'none';

    }


    // Основен текст

    const body =
        document.getElementById(
            'article-body'
        );


    if (data.content) {

        const paragraphs =
            data.content
                .split(/\n\s*\n/)
                .map(
                    paragraph =>
                        paragraph.trim()
                )
                .filter(
                    paragraph =>
                        paragraph.length > 0
                );


        body.innerHTML =
            paragraphs
                .map(
                    paragraph =>
                        `<p>${escapeHtml(paragraph)}</p>`
                )
                .join('');

    } else {

        body.innerHTML =
            '<p>Съдържанието на новината не е налично.</p>';

    }


    // ==========================================
    // СПОДЕЛЯНЕ В СОЦИАЛНИ МРЕЖИ
    // ==========================================

    /*
     * Това е истинският адрес на статията.
     *
     * Пример:
     * https://marianaklimentieva.github.io/Spisanieto/article.html?id=12
     *
     * Вече НЕ използваме Supabase адреса
     * като URL за споделяне.
     */

    const articleUrl =
        window.location.href;


    const encodedTitle =
        encodeURIComponent(
            data.title || 'СПИСАНИЕТО.'
        );


    const encodedArticleUrl =
        encodeURIComponent(
            articleUrl
        );


    // ==========================================
    // FACEBOOK
    // ==========================================

    document.getElementById(
        'share-facebook'
    ).href =
        'https://www.facebook.com/sharer/sharer.php?u=' +
        encodedArticleUrl;


    // ==========================================
    // MESSENGER
    // ==========================================

    document.getElementById(
        'share-messenger'
    ).href =
        'https://www.facebook.com/dialog/send?link=' +
        encodedArticleUrl;


    // ==========================================
    // VIBER
    // ==========================================

    document.getElementById(
        'share-viber'
    ).href =
        'viber://forward?text=' +
        encodedTitle +
        '%20' +
        encodedArticleUrl;


    // ==========================================
    // WHATSAPP
    // ==========================================

    document.getElementById(
        'share-whatsapp'
    ).href =
        'https://api.whatsapp.com/send?text=' +
        encodedTitle +
        '%20' +
        encodedArticleUrl;


    // ==========================================
    // X
    // ==========================================

    document.getElementById(
        'share-x'
    ).href =
        'https://twitter.com/intent/tweet?text=' +
        encodedTitle +
        '&url=' +
        encodedArticleUrl;


    // Показваме статията

    loading.style.display =
        'none';

    article.style.display =
        'block';


    // Заглавието на браузъра

    document.title =
        data.title +
        ' — СПИСАНИЕТО.';

}


function escapeHtml(text) {

    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


loadArticle();

</script>

</body>
</html>
