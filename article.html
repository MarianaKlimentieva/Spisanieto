<!DOCTYPE html>
<html lang="bg">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>СПИСАНИЕТО.</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --bg: #f7f6f2;
            --text: #111111;
            --accent: #8c1d40;
            --border: #e2dfd7;
            --font-serif: "Cormorant Garamond", serif;
            --font-sans: "Plus Jakarta Sans", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1180px, 92%);
            margin: 0 auto;
        }

        /* HEADER */

        header {
            border-bottom: 1px solid var(--border);
            background: var(--bg);
        }

        .header-inner {
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .tagline {
            margin-top: 4px;
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #666;
        }

        nav {
            border-top: 1px solid var(--border);
        }

        .nav-inner {
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 34px;
        }

        .nav-inner a {
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .nav-inner a:hover {
            color: var(--accent);
        }

        /* ARTICLE */

        .article-page {
            padding: 70px 0 100px;
        }

        .article-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .article-category {
            display: inline-block;
            margin-bottom: 18px;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .article-title {
            margin: 0;
            font-family: var(--font-serif);
            font-size: clamp(3rem, 6vw, 5.2rem);
            line-height: 0.95;
            font-weight: 600;
        }

        .article-subtitle {
            margin: 28px 0 0;
            max-width: 780px;
            font-family: var(--font-serif);
            font-size: 1.55rem;
            line-height: 1.35;
            color: #555;
        }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
            padding: 18px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            font-size: 0.82rem;
            color: #666;
        }

        .article-image {
            width: 100%;
            display: block;
            max-height: 620px;
            object-fit: cover;
            margin-bottom: 45px;
        }

        .article-content {
            max-width: 780px;
            margin: 0 auto;
            font-family: var(--font-serif);
            font-size: 1.35rem;
            line-height: 1.7;
        }

        .article-content p {
            margin: 0 0 25px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 35px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* ERROR */

        .error-message {
            text-align: center;
            padding: 100px 20px;
            font-family: var(--font-serif);
            font-size: 1.5rem;
        }

        /* FOOTER */

        footer {
            border-top: 1px solid var(--border);
            padding: 35px 0;
            margin-top: 40px;
        }

        .footer-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .footer-logo {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 700;
        }

        .footer-copy {
            font-size: 0.75rem;
            color: #777;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .header-inner {
                min-height: 120px;
            }

            .logo {
                font-size: 2.7rem;
            }

            .tagline {
                font-size: 0.65rem;
            }

            .nav-inner {
                gap: 14px;
                flex-wrap: wrap;
                padding: 15px 0;
            }

            .nav-inner a {
                font-size: 0.68rem;
            }

            .article-page {
                padding: 45px 0 70px;
            }

            .article-title {
                font-size: 3rem;
            }

            .article-subtitle {
                font-size: 1.25rem;
            }

            .article-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .article-image {
                max-height: 400px;
                margin-bottom: 30px;
            }

            .article-content {
                font-size: 1.2rem;
            }

            .footer-inner {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="container header-inner">

        <a
            href="index.html"
            class="logo"
        >
            СПИСАНИЕТО.
        </a>

        <div class="tagline">
            Всичко важно. На едно място.
        </div>

    </div>


    <nav>

        <div class="container nav-inner">

            <a href="index.html">
                Начало
            </a>

            <a href="index.html">
                Новини
            </a>

            <a href="index.html">
                Политика
            </a>

            <a href="index.html">
                Свят
            </a>

            <a href="index.html">
                Анализи
            </a>

            <a href="index.html">
                Лайфстайл
            </a>

        </div>

    </nav>

</header>



<main class="article-page">

    <div class="container article-container">

        <a
            href="index.html"
            class="back-link"
        >
            ← Назад към началната страница
        </a>


        <div id="article">

            <div class="error-message">
                Зареждане...
            </div>

        </div>

    </div>

</main>



<footer>

    <div class="container footer-inner">

        <div class="footer-logo">
            СПИСАНИЕТО.
        </div>

        <div class="footer-copy">
            © 2026 СПИСАНИЕТО. Всички права запазени.
        </div>

    </div>

</footer>



<script type="module">

    import {
        createClient
    }
    from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


    const SUPABASE_URL =
        'https://hxvflentlaktgwimsevc.supabase.co';


    const SUPABASE_ANON_KEY =
        'sb_publishable_waLxhS_U0hYHzlfp016b4g_bwDTjWGY';


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* --------------------------------------------------
       Получаване на ID на статията
    -------------------------------------------------- */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const articleId =
        params.get('id');


    const articleContainer =
        document.getElementById(
            'article'
        );


    /* --------------------------------------------------
       HTML escape
    -------------------------------------------------- */

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return '';
        }

        return String(value)
            .replace(
                /&/g,
                '&amp;'
            )
            .replace(
                /</g,
                '&lt;'
            )
            .replace(
                />/g,
                '&gt;'
            )
            .replace(
                /"/g,
                '&quot;'
            )
            .replace(
                /'/g,
                '&#039;'
            );

    }


    /* --------------------------------------------------
       Проверка за ID
    -------------------------------------------------- */

    if (!articleId) {

        articleContainer.innerHTML = `
            <div class="error-message">
                Новината не беше намерена.
            </div>
        `;

    } else {

        loadArticle();

    }


    /* --------------------------------------------------
       Зареждане на статията
    -------------------------------------------------- */

    async function loadArticle() {

        const {
            data,
            error
        } =
            await supabase

                .from('news')

                .select(`
                    id,
                    title,
                    subtitle,
                    content,
                    category,
                    author,
                    image_url,
                    created_at
                `)

                .eq(
                    'id',
                    articleId
                )

                .eq(
                    'status',
                    'published'
                )

                .single();


        if (error) {

            console.error(
                'Supabase error:',
                error
            );

            articleContainer.innerHTML = `
                <div class="error-message">
                    Възникна проблем при зареждането на новината.
                </div>
            `;

            return;

        }


        if (!data) {

            articleContainer.innerHTML = `
                <div class="error-message">
                    Новината не беше намерена.
                </div>
            `;

            return;

        }


        /* --------------------------------------------------
           Категория
        -------------------------------------------------- */

        const category =
            data.category ||
            'Новини';


        /* --------------------------------------------------
           Дата
        -------------------------------------------------- */

        const date =
            new Date(
                data.created_at
            );


        const formattedDate =
            date.toLocaleDateString(
                'bg-BG',
                {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                }
            );


        /* --------------------------------------------------
           Автор
        -------------------------------------------------- */

        const author =
            data.author ||
            'СПИСАНИЕТО.';


        /* --------------------------------------------------
           Снимка
        -------------------------------------------------- */

        const image =
            data.image_url ||
            'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1600&q=80';


        /* --------------------------------------------------
           Съдържание
        -------------------------------------------------- */

        const content =
            data.content || '';


        const paragraphs =
            content
                .split(/\r?\n/)
                .filter(
                    paragraph =>
                        paragraph.trim() !== ''
                )
                .map(
                    paragraph => `
                        <p>
                            ${escapeHtml(
                                paragraph
                            )}
                        </p>
                    `
                )
                .join('');


        /* --------------------------------------------------
           Показване на статията
        -------------------------------------------------- */

        articleContainer.innerHTML = `

            <span class="article-category">
                ${escapeHtml(category)}
            </span>


            <h1 class="article-title">
                ${escapeHtml(data.title)}
            </h1>


            ${
                data.subtitle
                ? `
                    <div class="article-subtitle">
                        ${escapeHtml(
                            data.subtitle
                        )}
                    </div>
                `
                : ''
            }


            <div class="article-meta">

                <span>
                    ${escapeHtml(author)}
                </span>

                <span>
                    ${formattedDate}
                </span>

            </div>


            <img
                src="${escapeHtml(image)}"
                class="article-image"
                alt="${escapeHtml(data.title)}"
            >


            <div class="article-content">
                ${paragraphs}
            </div>

        `;


        /* --------------------------------------------------
           Увеличаване на броя на гледанията
        -------------------------------------------------- */

        const {
            error: viewsError
        } =
            await supabase.rpc(
                'increment_news_views',
                {
                    news_id: articleId
                }
            );


        if (viewsError) {

            console.error(
                'Views error:',
                viewsError
            );

        }

    }

</script>


</body>

</html>
