<!DOCTYPE html>
<html lang="bg">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>СПИСАНИЕТО.</title>

    <meta
        name="description"
        content="Всичко важно. На едно място."
    >

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"

    <link

    >

    <style>

        :root {
            --bg-color: #f7f6f2;
            --text-color: #111111;
            --accent-color: #8c1d40;
            --border-color: #e2dfd7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: "Plus Jakarta Sans", sans-serif;
        }

        a {
            color: inherit;
        }

        .article-page {
            min-height: 100vh;
        }

        /* HEADER */

        .article-header {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 2rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-link {
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #666;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--accent-color);
        }

        .logo {
            font-family: "Cormorant Garamond", serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* ARTICLE */

        .article-container {
            max-width: 820px;
            margin: 0 auto;
            padding: 4rem 2rem 5rem;
        }

        .article-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 1.2rem;
        }

        .article-title {
            font-family: "Cormorant Garamond", serif;
            font-size: 3.2rem;
            line-height: 1.05;
            font-weight: 600;
            margin: 0 0 1.3rem;
        }

        .article-subtitle {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #555;
            margin-bottom: 1.5rem;
        }

        .article-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            align-items: center;
            font-size: 0.78rem;
            color: #777;
            margin-bottom: 2.5rem;
        }

        .article-image {
            width: 100%;
            height: 480px;
            object-fit: cover;
            display: block;
            margin-bottom: 2.8rem;
        }

        .article-content {
            font-size: 1.05rem;
            line-height: 1.9;
            color: #222;
        }

        .article-content p {
            margin: 0 0 1.5rem;
        }

        .article-content h2 {
            font-family: "Cormorant Garamond", serif;
            font-size: 2rem;
            line-height: 1.2;
            margin: 2.5rem 0 1rem;
        }

        .article-content h3 {
            font-family: "Cormorant Garamond", serif;
            font-size: 1.6rem;
            margin: 2rem 0 1rem;
        }

        .article-content strong {
            font-weight: 700;
        }

        .article-content em {
            font-style: italic;
        }

        .article-content ul,
        .article-content ol {
            margin-bottom: 1.5rem;
            padding-left: 1.5rem;
        }

        .article-content li {
            margin-bottom: 0.5rem;
        }

        .article-content blockquote {
            margin: 2rem 0;
            padding: 1rem 1.5rem;
            border-left: 3px solid var(--accent-color);
            color: #555;
            font-family: "Cormorant Garamond", serif;
            font-size: 1.4rem;
        }

        /* SHARE */

        .share-box {
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-top: 3rem;
            padding: 1.5rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .share-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #666;
            font-weight: 600;
        }

        .share-buttons {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .share-button {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            border-radius: 50%;
        }

        .share-button:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .share-button.facebook:hover {
            background: #1877f2;
            border-color: #1877f2;
        }

        .share-button.messenger:hover {
            background: #0084ff;
            border-color: #0084ff;
        }

        .share-button.viber:hover {
            background: #665cac;
            border-color: #665cac;
        }

        .share-button.whatsapp:hover {
            background: #25d366;
            border-color: #25d366;
        }

        .share-button.x:hover {
            background: #111;
            border-color: #111;
        }

        /* FOOTER */

        .article-footer {
            border-top: 1px solid var(--border-color);
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
            color: #777;
            font-size: 0.75rem;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .article-header {
                padding: 1.5rem 1.2rem;
            }

            .logo {
                font-size: 1.6rem;
            }

            .article-container {
                padding: 2.5rem 1.2rem 4rem;
            }

            .article-title {
                font-size: 2.4rem;
            }

            .article-subtitle {
                font-size: 1rem;
            }

            .article-image {
                height: 300px;
            }

            .article-content {
                font-size: 1rem;
                line-height: 1.8;
            }

            .share-box {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>

<body>

<div class="article-page">

    <!-- HEADER -->

        <a

        >
            ← Назад
        </a>

        <div class="logo">
            СПИСАНИЕТО.
        </div>

    </header>


    <!-- ARTICLE -->

    <main class="article-container">

        <div
            id="article-category"
            class="article-category"
        ></div>

        <h1
            id="article-title"
            class="article-title"
        >

        </h1>

        <div

        ></div>

        <div class="article-meta">

            <span id="article-author">
                Автор: СПИСАНИЕТО.
            </span>

            <span>·</span>

            <span id="article-date"></span>

        </div>


        <img
            id="article-image"
            class="article-image"
            src=""
            alt=""
            style="display:none;"
        >


        <div
            id="article-content"
            class="article-content"
        ></div>


        <!-- SHARE -->

        <div class="share-box">

            <div class="share-title">

            </div>

            <div class="share-buttons">

                <a
                    id="share-facebook"
                    class="share-button facebook"

                >
                    f

                <a
                    id="share-messenger"
                    class="share-button messenger"

                    m

                <a
                    id="share-viber"
                    class="share-button viber"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Сподели във Viber"
                >
                    v
                </a>

                <a
                    id="share-whatsapp"
                    class="share-button whatsapp"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Сподели в WhatsApp"
                >
                    w
                </a>

                <a
                    id="share-x"
                    class="share-button x"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"

                >
                    𝕏
                </a>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="article-footer">
        © СПИСАНИЕТО. Всичко важно. На едно място.
    </footer>

</div>


<script>

    /* ================================
       SUPABASE
    ================================= */

    const SUPABASE_URL =
        'https://hxvflentlaktgwimsevc.supabase.co';

    const SUPABASE_KEY =
        'sb_publishable_waLxhS_U0hYHzlfp016b4g_bwDTjWGY';


    /* ================================
       SUPABASE CLIENT
    ================================= */

    const supabase =
        window.supabaseClient ||
        {
            from: function () {
                throw new Error(
                    'Supabase client не е зареден.'
                );
            }
        };


</script>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>

    /* ================================
       INITIALIZE SUPABASE
    ================================= */

    const client =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* ================================
       ARTICLE ID
    ================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const articleId =
        params.get('id');


    /* ================================
       ESCAPE HTML
    ================================= */

    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return '';
        }

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

    }


    /* ================================
       LOAD ARTICLE
    ================================= */

    async function loadArticle() {

        if (!articleId) {

            document.getElementById(
                'article-title'
            ).textContent =
                'Новината не е намерена.';

            return;
        }


        const {
            data,
            error
        } = await client

            .from('news')

            .select(`
                id,
                title,
                subtitle,
                content,
                category,
                image_url,
                created_at,
                views
            `)

            .eq(
                'id',
                articleId
            )

            .eq(
                'status',
                'published'
            )

            .single();


        if (error || !data) {

            console.error(error);

            document.getElementById(
                'article-title'
            ).textContent =
                'Новината не е намерена.';

            return;
        }


        /* ================================
           CATEGORY
        ================================= */

        document.getElementById(
            'article-category'
        ).textContent =
            data.category || 'Новини';


        /* ================================
           TITLE
        ================================= */

        document.getElementById(
            'article-title'
        ).textContent =
            data.title || '';


        /* ================================
           SUBTITLE
        ================================= */

        const subtitleElement =
            document.getElementById(
                'article-subtitle'
            );

        if (data.subtitle) {

            subtitleElement.textContent =
                data.subtitle;

            subtitleElement.style.display =
                'block';

        } else {

            subtitleElement.style.display =
                'none';

        }


        /* ================================
           AUTHOR
        ================================= */

        document.getElementById(
            'article-author'
        ).textContent =
            'Автор: СПИСАНИЕТО.';


        /* ================================
           DATE + VIEWS
        ================================= */

        const date =
            new Date(
                data.created_at
            );

        const formattedDate =
            date.toLocaleDateString(
                'bg-BG',
                {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                }
            );


        let currentViews =
            Number(data.views) || 0;


        const {
            error: viewsError
        } = await client.rpc(
            'increment_news_views',
            {
                news_id:
                    Number(articleId)
            }
        );


        if (!viewsError) {
            currentViews++;
        }


        document.getElementById(
            'article-date'
        ).textContent =
            formattedDate +
            ' · 👁 ' +
            currentViews;


        /* ================================
           IMAGE
        ================================= */

        const image =
            document.getElementById(
                'article-image'
            );


        if (data.image_url) {

            image.src =
                data.image_url;

            image.alt =
                data.title || '';

            image.style.display =
                'block';

        } else {

            image.style.display =
                'none';

        }


        /* ================================
           CONTENT
        ================================= */

        document.getElementById(
            'article-content'
        ).innerHTML =
            escapeHtml(
                data.content || ''
            ).replace(
                /\n/g,
                '<br>'
            );


        /* ================================
           PAGE TITLE
        ================================= */

        document.title =
            (data.title || 'СПИСАНИЕТО.') +
            ' — СПИСАНИЕТО.';


        /* ================================
           NORMAL ARTICLE URL
        ================================= */

        const articleUrl =
            window.location.href;


        const encodedTitle =
            encodeURIComponent(
                data.title ||
                'СПИСАНИЕТО.'
            );


        const encodedArticleUrl =
            encodeURIComponent(
                articleUrl
            );


        /* ================================
           FACEBOOK
           
           ВАЖНО:
           Използваме нормалния URL на
           статията, а не Supabase URL.
        ================================= */

        document.getElementById(
            'share-facebook'
        ).href =
            'https://www.facebook.com/sharer/sharer.php?u=' +
            encodedArticleUrl;


        /* ================================
           MESSENGER
        ================================= */

        document.getElementById(
            'share-messenger'
        ).href =
            'https://www.facebook.com/dialog/send?link=' +
            encodedArticleUrl;


        /* ================================
           VIBER
        ================================= */

        document.getElementById(
            'share-viber'
        ).href =
            'viber://forward?text=' +
            encodedTitle +
            '%20' +
            encodedArticleUrl;


        /* ================================
           WHATSAPP
        ================================= */

        document.getElementById(
            'share-whatsapp'
        ).href =
            'https://api.whatsapp.com/send?text=' +
            encodedTitle +
            '%20' +
            encodedArticleUrl;


        /* ================================
           X
        ================================= */

        document.getElementById(
            'share-x'
        ).href =
            'https://twitter.com/intent/tweet?text=' +
            encodedTitle +
            '&url=' +
            encodedArticleUrl;

    }


    /* ================================
       START
    ================================= */

    loadArticle();

</script>

</body>

</html>
